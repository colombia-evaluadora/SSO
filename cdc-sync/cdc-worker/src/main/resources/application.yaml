spring:
  application:
    name: cdc-worker
  rabbitmq:
    host: ${CDC_AMQP_HOST:localhost}
    port: ${CDC_AMQP_PORT:5672}
    username: ${CDC_AMQP_USER:cdc}
    password: ${CDC_AMQP_PASSWORD:demopass}
    listener:
      simple:
        prefetch: 100
        acknowledge-mode: manual
        # Number of concurrent consumer threads processing the cdc.worker queue.
        # Both default to 1 to preserve the historical behavior; bump them on busy
        # pipelines so a slow destination (e.g. Oracle reverse-sync) doesn't gate
        # the other. With cdc.destinations.oracle.enabled=false you can crank
        # this up to drain the backlog without burning retries.
        concurrency: ${CDC_WORKER_CONCURRENCY_MIN:1}
        max-concurrency: ${CDC_WORKER_CONCURRENCY_MAX:1}
        retry:
          enabled: false  # el retry lo manejamos manualmente en el consumer
  datasource:
    url: ${CDC_ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${CDC_ORACLE_USER:ACADEMICO}
    password: ${CDC_ORACLE_PASSWORD:Academico123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

cdc:
  rabbitmq:
    queue: cdc.worker
    dlq: cdc.worker.dlq
    exchange: cdc.events
  oracle:
    schema-user: ${CDC_ORACLE_USER:ACADEMICO}
  clickhouse:
    url: ${CDC_CLICKHOUSE_URL:http://default:demopass@localhost:8123}
  # Destination toggles. Decouple ClickHouse audit from Oracle reverse-sync so a
  # failure in one doesn't waste retry budget on the other. Set to false while
  # debugging a broken Oracle schema to drain the backlog at full speed.
  destinations:
    clickhouse:
      enabled: ${CDC_DEST_CLICKHOUSE:true}
    oracle:
      enabled: ${CDC_DEST_ORACLE:true}
  retry:
    max-attempts: 5
    initial-backoff-ms: 1000
    max-backoff-ms: 60000

  # ──────────────────────────────────────────────────────────────────
  # Phase 3 retrocompatibilidad knobs.
  #
  # `snapshot.hydrate-on-startup` lets ops skip the boot-time PG bulk
  # read (six queries for tmatricula_socioeconomico / _promocion /
  # tsede_usuario / tcriterio_evaluacion / tgrupo / tlista_valor) when
  # the destination is the ClickHouse-only debug profile — those
  # transformers will then degrade to SnapshotCache.empty() and emit
  # WARN + skip on the first cache miss, which is the documented
  # failure mode.
  #
  # `pg.snapshot.url` accepts a dedicated read-only connection string;
  # defaults to the upstream CDC_PG_URL when the env var is unset.
  #
  # `s3.*` controls the HttpS3BlobFetcher used by TArchivoBlobDropper
  # for TARCHIVO BLOBs. `timeout-ms` is the hard exchange timeout;
  # `max-bytes` is the payload cap (BoundedInputStream aborts the
  # connection above this — defaults to 100 MiB).
  #
  # `tables.*` toggles gate specific tables whose Oracle destination
  # is not yet on the target schema. They bypass router.route() via
  # CDC_DEST_ORACLE=false at the worker level today; per-table gating
  # will land alongside the table-routing.yaml `skip:` entries.
  # ──────────────────────────────────────────────────────────────────
  snapshot:
    hydrate-on-startup: ${CDC_SNAPSHOT_HYDRATE_ON_STARTUP:true}
  pg:
    snapshot:
      url: ${CDC_PG_SNAPSHOT_URL:${CDC_PG_URL}}
  s3:
    timeout-ms: ${CDC_S3_TIMEOUT_MS:30000}
    max-bytes: ${CDC_S3_MAX_BYTES:104857600}
  tables:
    tarchivo:
      enabled: ${CDC_TABLE_TARCHIVO_ENABLED:true}
    tdescansos:
      enabled: false
    treserva_cupo:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: true
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.example.cdc: DEBUG
