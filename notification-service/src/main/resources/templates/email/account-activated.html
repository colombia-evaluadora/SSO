<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Your account is now active</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 560px; margin: 0 auto; padding: 32px; color: #1f2937;">
<h1 style="font-size: 20px; margin: 0 0 16px;">Your account is now active</h1>
<p>Hello <span th:text="${displayName}">there</span>,</p>
<p>Your account <strong th:text="${username}">user</strong> has been activated successfully. You can now sign in with your credentials.</p>
<p style="margin: 32px 0;">
    <a href="https://app.example.com/login"
       style="display: inline-block; padding: 12px 24px; background-color: #16a34a; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 600;">
        Sign in
    </a>
</p>
<hr style="border: none; border-top: 1px solid #e5e7eb; margin: 32px 0;"/>
<p style="font-size: 12px; color: #6b7280;">Sent by notification-service.</p>
</body>
</html>
