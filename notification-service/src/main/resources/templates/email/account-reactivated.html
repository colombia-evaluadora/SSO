<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Your account was reactivated</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 560px; margin: 0 auto; padding: 32px; color: #1f2937;">
<h1 style="font-size: 20px; margin: 0 0 16px;">Your account was reactivated</h1>
<p>Hello <span th:text="${displayName}">there</span>,</p>
<p>Your account <strong th:text="${email}">user</strong> has been reactivated by an administrator.</p>
<p>You can sign in again with your existing password.</p>
<hr style="border: none; border-top: 1px solid #e5e7eb; margin: 32px 0;"/>
<p style="font-size: 12px; color: #6b7280;">Sent by notification-service.</p>
</body>
</html>
