<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>A role was revoked from your account</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 560px; margin: 0 auto; padding: 32px; color: #1f2937;">
<h1 style="font-size: 20px; margin: 0 0 16px;">A role was revoked from your account</h1>
<p>Hello <span th:text="${displayName}">there</span>,</p>
<p>The role <strong th:text="${roleName}">ROLE</strong> has been removed from <strong th:text="${username}">user</strong>.</p>
<p>Features previously available to that role will no longer be accessible after your next sign-in. If you weren't expecting this, please contact your administrator.</p>
<hr style="border: none; border-top: 1px solid #e5e7eb; margin: 32px 0;"/>
<p style="font-size: 12px; color: #6b7280;">Sent by notification-service.</p>
</body>
</html>
