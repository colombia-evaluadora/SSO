<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Welcome aboard</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 560px; margin: 0 auto; padding: 32px; color: #1f2937;">
<h1 style="font-size: 20px; margin: 0 0 16px;">Welcome to the platform</h1>
<p>Hi <span th:text="${displayName}">there</span>,</p>
<p>Your account is ready. Use the button below to sign in and complete your profile.</p>
<p style="margin: 32px 0;">
    <a th:href="${loginLink}"
       style="display: inline-block; padding: 12px 24px; background-color: #16a34a; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 600;">
        Sign in
    </a>
</p>
<p>If you have any questions, just reply to this email.</p>
<hr style="border: none; border-top: 1px solid #e5e7eb; margin: 32px 0;"/>
<p style="font-size: 12px; color: #6b7280;">
    Sent by notification-service. Reference: <span th:text="${notificationId}">notificationId</span>
</p>
</body>
</html>
