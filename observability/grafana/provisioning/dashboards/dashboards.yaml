apiVersion: 1

providers:
  - name: "default"
    orgId: 1
    folder: "SSO"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # Grafana container sees this path as
      # /etc/grafana/dashboards (mounted by the compose volume).
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false