# =====================================================================
# Grafana Tempo — traces backend, monolithic single-binary mode with
# local filesystem storage. Fine for a Docker Compose dev stack; swap
# `storage.trace.backend` to s3/gcs for production HA.
#
# In Tempo v3 the monolithic config no longer accepts top-level
# `ingester:` / `compactor:` / `traces_storage:` blocks. The
# `metrics_generator` block was also radically simplified — the v2
# `registry` / `storage` / `remote_write` / `traces_storage` /
# `processor` sub-fields no longer exist in v3 (most moved to
# Kafka-based generator.* flags). For a basic trace store in v3
# monolithic mode you only need `distributor`, `storage.trace`,
# `query_frontend`. The RED metrics / service-graph are emitted
# by `metrics_generator` (see bottom of file) and pushed to Mimir
# via Prometheus remote_write so TraceQL `| rate()` and
# `| histogram_over_time()` queries can resolve.
# =====================================================================
stream_over_http_enabled: true

server:
  http_listen_port: 3200

# Anonymous usage reporting off — dev stack, no phone-home.
usage_report:
  reporting_enabled: false

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/traces

# query_frontend must be present in monolithic mode so the ingester's
# query path can route through it.
query_frontend:
  search:
    max_duration: 168h

# =====================================================================
# metrics_generator — processes ingested spans and emits RED metrics
# (span_metrics) and the service graph (service_graphs) to Mimir via
# Prometheus remote_write. Without this block, TraceQL operators that
# aggregate over time (`| rate()`, `| histogram_over_time()`,
# `| compare()`) fail with "empty ring" because the querier has no
# generator instances to read from.
#
# Architecture notes for the 2.10.7 monolithic deployment:
#   - ring.kvstore.store = inmemory: a single Tempo process needs
#     no gossip / memberlist peers. memberlist (the default) would
#     log "no peers found" warnings every 5s forever.
#   - storage.path: WAL for the local accumulator. Must live in
#     the tempo-data volume so it survives container restarts
#     and WAL replay works on boot.
#   - storage.remote_write → http://mimir:9009/api/v1/push: the
#     generated metrics land in Mimir (same place the app's
#     Micrometer metrics go), so dashboards can join the two
#     seamlessly via the `service` label.
#   - processor.*.dimensions = []: by default these processors
#     explode cardinality (http.method, http.status_code, etc.).
#     For a dev stack, the service + span_name + span_kind
#     intrinsic dimensions are already enough to be useful.
# =====================================================================
metrics_generator:
  ring:
    kvstore:
      store: inmemory
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
  processor:
    service_graphs:
      dimensions: []
    span_metrics:
      dimensions: []
