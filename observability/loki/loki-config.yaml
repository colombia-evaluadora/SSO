# =====================================================================
# Grafana Loki — logs backend, single-binary mode with local
# filesystem storage and the TSDB index (schema v13). Receives logs
# two ways: native OTLP (/otlp/v1/logs) from the Spring services via
# Alloy, and the classic push API (/loki/api/v1/push) for Faro RUM.
# =====================================================================
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for OTLP ingestion — OTel resource/scope attributes are
  # written as Loki structured metadata rather than high-cardinality
  # stream labels.
  allow_structured_metadata: true
  retention_period: 168h        # 7 days, dev
  volume_enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# Analytics phone-home off.
analytics:
  reporting_enabled: false
