server:
  # Default to 8084 — sso-admin is 8083, gateway 8080,
  # auth-center 8081, hello-service 8082.
  port: ${PORT:8084}
  shutdown: graceful

spring:
  application:
    name: query-service
  main:
    banner-mode: off

  # Disable Spring Boot's auto-configured single
  # DataSource / JPA stack. We own the multi-DB pool
  # creation in DataSourceConfig, keyed off
  # query.datasources.*. Letting the autoconfig fire
  # creates a phantom "primary" DataSource with an H2
  # in-memory default URL (the test classpath has H2),
  # which then conflicts with our Map<String, DataSource>.
  #
  # NOTE — Spring Boot 4 package moves: the autoconfig
  # classes relocated from `...autoconfigure.jdbc.*` and
  # `...autoconfigure.orm.jpa.*` (Boot 3) into the
  # dedicated `spring-boot-jdbc` and `spring-boot-hibernate`
  # modules. The Boot 3 paths below are NO-OPs in Boot 4 —
  # autoconfig still runs and tries to wire a phantom
  # DataSource, which fails with
  # "Failed to determine a suitable driver class" because
  # the container has no JDBC URL property binding. The
  # Boot 4 fully-qualified class names are listed below.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

  # V60 — preservación del diagnóstico al fallar el parseo del
  # cuerpo. Sin esto Jackson 3 (transitivo de Boot 4) REDACTA
  # el fragmento responsable en el log: el operador sólo ve
  # el byte offset y un mensaje como "byte offset: #201", sin
  # saber si fue una coma faltante, una cadena sin cerrar o un
  # array como raíz. Activarlo imprime el snippet alrededor
  # del offset, acotado a ~80 caracteres por Jackson.
  jackson:
    deserialization:
      fail-on-unknown-properties: false
      fail-on-null-for-primitives: true
      wrap-exceptions: true
    parser:
      include-source-in-location: true
      max-string-length: 1048576
      max-number-length: 1000

  data:
    redis:
      # Same shared sso-redis instance as auth-center — wired from
      # REDIS_HOST/REDIS_PORT/REDIS_PASSWORD via docker-compose (and,
      # for provisioner-spawned instances, DockerSocket#buildEnv).
      # Defaults are localhost so `mvn spring-boot:run` on the host
      # works without the compose stack.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Short timeout — a read endpoint should fall through to the
      # DB/JDBC path fast when Redis is unreachable, not hang.
      timeout: 2s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: false
  instance:
    # See auth-center / sso-admin for the full rationale.
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Per-dialect JDBC pools. In dev only Postgres is enabled;
# the Oracle and SQL Server entries are commented out as a
# template. Set QUERY_CATALOG_BASE_URL to the sso-admin
# gateway route (or the direct service address in prod).
#
# For container runs the compose env block builds
# QUERY_DS_POSTGRES_URL from QUERY_DS_POSTGRES_HOST /
# _PORT / _NAME / _SSLMODE / _CHANNEL_BINDING and passes
# it as QUERY_DS_POSTGRES_URL, so this property is
# overridden at runtime. The default below is the
# host-mode fallback for `mvn spring-boot:run` outside
# compose.
query:
  datasources:
    entries:
      postgres:
        enabled: ${QUERY_DS_POSTGRES_ENABLED:true}
        url: ${QUERY_DS_POSTGRES_URL:jdbc:postgresql://localhost:5432/query}
        username: ${QUERY_DS_POSTGRES_USER:query}
        password: ${QUERY_DS_POSTGRES_PASSWORD:change-me}
        maximum-pool-size: 10
      # oracle:
      #   enabled: ${QUERY_DS_ORACLE_ENABLED:false}
      #   url: ${QUERY_DS_ORACLE_URL:jdbc:oracle:thin:@//oracle-host:1521/ORCLPDB1}
      #   username: ${QUERY_DS_ORACLE_USER:query}
      #   password: ${QUERY_DS_ORACLE_PASSWORD:change-me}
      # sqlserver:
      #   enabled: ${QUERY_DS_SQLSERVER_ENABLED:false}
      #   url: ${QUERY_DS_SQLSERVER_URL:jdbc:sqlserver://mssql-host:1433;databaseName=query}
      #   username: ${QUERY_DS_SQLSERVER_USER:query}
      #   password: ${QUERY_DS_SQLSERVER_PASSWORD:change-me}
  catalog:
    base-url: ${QUERY_CATALOG_BASE_URL:http://localhost:8080/sso-admin}
    # V30 — shared secret for the /internal/pathTemplates
    # endpoint on sso-admin. MUST match sso-admin's
    # sso.internal.token. Empty default fails closed
    # (path-registry returns 503 until configured); the
    # WAL log makes the misconfiguration obvious.
    internal-token: ${QUERY_CATALOG_INTERNAL_TOKEN:}
    read-timeout: 3s
    connect-timeout: 2s
  # V27/V30 — controls the path-template in-memory registry
  # refresh cadence. Default 60s; the registry's first
  # load happens at boot via @Scheduled initialDelay=0 so
  # the dispatcher is warm before the first request.
  path-registry:
    refresh-ms: ${QUERY_PATH_REGISTRY_REFRESH_MS:60000}
  # V33 — Resilience4j protection for the read path.
  #   bulkhead caps CONCURRENT JDBC calls per dialect so a
  #     single slow query can't starve the HikariCP pool.
  #   rate-limit caps RPS per principal (the JWT subject);
  #     overflow returns 429 with Retry-After.
  # The defaults below are conservative for prod. CI / dev
  # override them via application-test.yml or
  # @TestPropertySource — see ResilienceIntegrationTest.
  resilience:
    bulkhead:
      max-concurrent: ${QUERY_BULKHEAD_MAX_CONCURRENT:20}
      max-queue: ${QUERY_BULKHEAD_MAX_QUEUE:50}
      wait-duration: ${QUERY_BULKHEAD_WAIT_DURATION:200ms}
    rate-limit:
      rps: ${QUERY_RATE_LIMIT_RPS:100}
      window: ${QUERY_RATE_LIMIT_WINDOW:1s}
  # Redis-backed @Cacheable settings.
  cache:
    # TTL for "schema-metadata" (@Cacheable("tables") /
    # @Cacheable("columns")) — GET /tables and GET /columns.
    # Schema shape changes rarely, so this is intentionally long;
    # an admin who just altered a table can bump this down or
    # flush Redis manually if they need the picker to reflect it
    # immediately.
    metadata-ttl-seconds: ${QUERY_CACHE_METADATA_TTL_SECONDS:600}
    # Master switch for catalog-opt-in caching of GET /** rows —
    # see QueryPathController. Independent of the metadata caches
    # above; turning this off does not disable /tables or /columns.
    catalog-enabled: ${QUERY_CACHE_CATALOG_ENABLED:true}

sso:
  jwt:
    # Sólo la pública: query-service verifica, no emite.
    # Debe ser la pareja de la JWT_PRIVATE_KEY de auth-center.
    public-key: ${JWT_PUBLIC_KEY}
    issuer: sso-postgres
    header-name: Authorization
    token-prefix: "Bearer "

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  otlp:
    metrics:
      export:
        # Default deshabilitado: si el perfil de observabilidad esta apagado
        # (Alloy no existe) y algo arranca el jar sin pasar
        # MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED explicitamente (docker-compose
        # SI lo pasa siempre, pero un `docker run` a mano o un test no), el
        # default de Spring Boot Actuator para esta propiedad es "true" ---
        # sin este override el registry igual arranca e intenta pushear cada
        # 10s contra un host que no resuelve.
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
    resource-attributes:
      service.namespace: sso
      deployment.environment: ${DEPLOY_ENV:dev}
  tracing:
    # Mismo motivo que arriba, y ademas conecta la variable real: el nombre
    # historico en docker-compose.yml (MANAGEMENT_TRACING_EXPORT_ENABLED) no
    # correspondia a ninguna propiedad real de Spring (no existe
    # "management.tracing.export.enabled") -- la unica que existe es
    # "management.tracing.enabled", hardcodeada en "true" hasta ahora, asi
    # que el interruptor de docker-compose nunca apagaba tracing de verdad.
    enabled: ${MANAGEMENT_TRACING_EXPORT_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACING_SAMPLE_RATE:1.0}

logging:
  level:
    root: INFO
    com.co.eurekatic: INFO