server:
  port: ${PORT:8086}
  shutdown: graceful

spring:
  application:
    name: file-service
  main:
    banner-mode: off

  # ---------------------------------------------------------------------------
  # Límites de subida. SIN ESTO, UN CLIENTE PUEDE LLENAR EL DISCO.
  #
  # El repo no tenía ningún límite configurado en ningún módulo, y el
  # servidor de pruebas está al 85% con 12 GB libres. Spring, por
  # defecto, no limita el tamaño de un multipart.
  #
  # `file-size-threshold` en 0 hace que todo vaya a disco temporal en
  # vez de a memoria: con menos de 1 GB disponible, tres subidas
  # simultáneas en heap devolverían la caja al swap.
  # ---------------------------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: ${FILES_MAX_FILE_SIZE:25MB}
      max-request-size: ${FILES_MAX_REQUEST_SIZE:30MB}
      file-size-threshold: 0

  datasource:
    url: ${FILES_DS_URL}
    username: ${FILES_DS_USERNAME}
    password: ${FILES_DS_PASSWORD}
    hikari:
      maximum-pool-size: ${FILES_DS_POOL_SIZE:5}

files:
  # Esquema donde vive TARCHIVO.
  schema: ${FILES_SCHEMA:academico_test}

  # V64 — código de sede que se antepone a la clave S3 de las filas
  # nuevas (TransformadorMultipart.claveDe), imitando el primer
  # segmento que ya traen las filas históricas migradas
  # (ACADEMICO_VALLEDUPAR/perfilUsuario/141906.jpeg). Una instalación
  # de file-service sirve UNA sola sede, así que es una constante de
  # despliegue — igual que `schema` arriba — no algo que decida cada
  # subida. Vacío (default) = sin prefijo.
  site-code: ${FILES_SITE_CODE:}

  # A dónde se reenvía el JSON ya transformado. Apunta al gateway para
  # que la petición pase por las mismas reglas de autorización que
  # cualquier otra: este servicio no es una puerta trasera al catálogo.
  catalog-base-url: ${FILES_CATALOG_BASE_URL:http://sso-api-gateway:8080/api}

  # Secreto compartido con el catálogo PL/pgSQL. Quien lo presente en
  # X-Internal-Token puede pedir GET /api/files/download/{id} sin
  # llevar JWT — el catálogo actúa por su cuenta, no en nombre de un
  # usuario. Vacío = esa puerta está cerrada y la única forma de
  # descargar es con un JWT válido.
  # No confundir con SSO_INTERNAL_TOKEN / GATEWAY_INTERNAL_TOKEN:
  # son tres secretos independientes (mismo valor por simplicidad
  # operativa, pero rotarlos debe hacerse de forma sincronizada).
  internal-token: ${FILES_INTERNAL_TOKEN:}

  # Firma los tokens de GET /files/view/{id}?token=... — acceso de
  # solo-lectura a UN archivo, de vida corta, para un <img src="...">
  # que no puede mandar Authorization. Ver ViewTokenService. Vacío =
  # POST /files/view-token/{id} responde 503: sin secreto no hay forma
  # segura de acuñar ni validar tokens, así que la puerta se queda
  # cerrada en vez de acuñar tokens que nadie puede verificar después
  # de un reinicio (secreto regenerado = tokens ya emitidos, inválidos).
  view-token-secret: ${FILES_VIEW_TOKEN_SECRET:}
  # 5 minutos: alcanza para que el navegador cargue la imagen (incluso
  # con reintentos) sin dejar la URL utilizable por más tiempo del que
  # hace falta si queda en el historial o en logs de acceso.
  view-token-ttl-seconds: ${FILES_VIEW_TOKEN_TTL_SECONDS:300}

  s3:
    # Vacío = AWS real. Con valor = almacén compatible (Garage en dev).
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:eval-col}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    # Obligatorio contra un endpoint local: no hay DNS por bucket, así
    # que el SDK debe pedir /bucket/objeto. Contra AWS se pone en false.
    path-style: ${S3_PATH_STYLE:true}

# Bloque de PRIMER NIVEL. Va al final del fichero y no entre medias
# de `files:` — insertarlo ahí dejaba las claves `s3:` que venían
# detrás colgando de `sso:`, y `files.s3.bucket` desaparecía. El
# servicio no arrancaba: PlaceholderResolutionException en bucle.
sso:
  jwt:
    # Sólo la pública: file-service verifica, no emite. Debe ser la
    # pareja de la JWT_PRIVATE_KEY de auth-center.
    #
    # Hasta ahora este servicio no validaba nada: confiaba en que el
    # gateway hubiera autenticado antes de reenviar (ver
    # ReenvioController, que se limita a propagar el Authorization).
    # DownloadController sí verifica la firma, porque es el único
    # endpoint que devuelve BYTES de un archivo: si algún día alguien
    # alcanza este servicio sin pasar por el gateway, la diferencia
    # entre confiar en la cabecera y comprobar la firma es la
    # diferencia entre entregar el archivo a cualquiera y no hacerlo.
    public-key: ${JWT_PUBLIC_KEY}
    issuer: sso-postgres
    header-name: Authorization
    token-prefix: "Bearer "

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eurekaserver:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    com.co.eurekatic.files: INFO
    # El SDK de AWS es muy verboso en DEBUG y filtra cabeceras firmadas.
    software.amazon.awssdk: WARN
