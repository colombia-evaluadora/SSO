server:
  # Default 9000 — the only callers (sso-admin + the
  # docker host's external probes) hit this port. Override
  # via PORT env var.
  port: ${PORT:9000}
  shutdown: graceful

spring:
  application:
    name: provisioner
  main:
    banner-mode: off
  # Exclude JPA/DataSource auto-config: the `common` module
  # pulls in spring-boot-starter-data-jpa, but the provisioner
  # is a stateless Docker socket sidecar that does NOT need a
  # DB. Without this exclusion, Spring Boot tries to autoconfigure
  # a DataSource on startup, fails (no DB URL in the env), and
  # the app crashes with
  # "Failed to configure a DataSource: 'url' attribute is not
  # specified and no embedded datasource could be configured."
  # That crash put sso-admin into a restart loop because
  # depends_on: provisioner: condition: service_started never
  # resolved, cascading into query-service-postgres as well.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

docker:
  image: ${DOCKER_IMAGE:eurekatic/query-service:1.0.0-SNAPSHOT}
  network: ${DOCKER_NETWORK:sso_postgres_modernize_default}
  socket-path: ${DOCKER_SOCKET_PATH:/var/run/docker.sock}
  eureka-url: ${EUREKA_URL:http://eurekaserver:8761/eureka}
  # OTLP endpoint propagado a cada contenedor de query-service que
  # el provisioner spawnea. Misma env var que el resto del stack
  # compose consume (api-gateway / auth-center / etc.) para que el
  # observability sea consistente: el operador la sobreescribe en
  # .env si el colector vive en otra red o host. Sin esta env var
  # el query-service spawneado cae al default localhost:4318 de su
  # application.yml y los exporters warn con Connection refused.
  otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy:4318}
  ready-timeout-seconds: ${READY_TIMEOUT:45}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
    resource-attributes:
      service.namespace: sso
      deployment.environment: ${DEPLOY_ENV:dev}
  tracing:
    enabled: true
    sampling:
      probability: ${OTEL_TRACING_SAMPLE_RATE:1.0}

logging:
  level:
    root: INFO
    com.co.eurekatic: INFO