server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: auth-center
  main:
    banner-mode: off

  datasource:
    # The localhost default assumes the operator is running
    # auth-center on the host with Postgres reachable via the
    # Docker port mapping (compose forwards
    # ${POSTGRES_PORT:-5432}:5432 to the host's loopback).
    # For container runs the compose env block sets
    # SPRING_DATASOURCE_URL with the fully-built JDBC URL
    # (composed from DB_URL host:port + DB_NAME + DB_SSLMODE +
    # DB_CHANNEL_BINDING), so this property is overridden at
    # runtime. The default below is the host-mode fallback for
    # `mvn spring-boot:run` outside compose.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sso}
    username: ${DB_USER:sso}
    password: ${DB_PASSWORD:change-me-in-prod}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # 5s instead of Hikari's 30s default. A request that
      # can't get a connection within 5s is in a worse state
      # than 503ing fast — the default 30s makes every login
      # / refresh / user-lookup hang for half a minute when
      # Postgres is briefly unreachable, which is what users
      # perceive as "the app is broken". 5s is short enough
      # to fail fast, long enough to absorb a normal TCP
      # handshake under load.
      connection-timeout: 5000
      # Same idea on the liveness probe: a connection that
      # can't pass `SELECT 1` in 3s is dead, kill it.
      validation-timeout: 3000
      # When the pool starts up, if the very first connection
      # can't be acquired, fail the application boot instead
      # of starting in a half-broken state. The default of
      # 1ms (== "wait forever") is a footgun: every request
      # would time out on the connection-timeout above
      # instead of the operator getting a clear
      # "Postgres is down" message at startup.
      initialization-fail-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  data:
    redis:
      # Wired from REDIS_HOST/REDIS_PORT/REDIS_PASSWORD via
      # docker-compose. Defaults are localhost so a `mvn spring-boot:run`
      # on the host machine works without the compose stack (assuming
      # a local Redis on the default port).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Short timeout — the refresh-token path must fail fast when
      # Redis is unreachable; the controller returns 401, the SPA
      # forces re-login. Don't let a stuck Lettuce command hold a
      # /auth/refresh request open for the default 60s.
      timeout: 2s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # IMPORTANT: keep healthcheck DISABLED. When enabled, the Eureka
    # client polls /actuator/health locally BEFORE each heartbeat and
    # reports whatever the aggregator says. During the JPA / Tomcat /
    # FreeMarker warm-up window the aggregator can transiently flip
    # to DOWN, which Eureka then records as DOWN and refuses to
    # route to. With this off, Eureka relies solely on the
    # lease/heartbeat — a successful renew => UP, no renewal => DOWN.
    healthcheck:
      enabled: false
  instance:
    # Use the container's hostname (set by Docker to the container
    # ID like "6f598709a7dc") and let the gateway's `lb://auth-center`
    # resolve via Docker's embedded DNS (127.0.0.11) to the bridge IP
    # (172.18.0.x). Setting `prefer-ip-address: false` keeps Eureka
    # from advertising a NIC IP that the gateway can't reach.
    hostname: ${AUTH_CENTER_HOSTNAME:auth-center}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

sso:
  jwt:
    # Production deployments MUST set JWT_SECRET. The default is a
    # 64-byte placeholder; JwtTokenService refuses to start with a
    # secret shorter than 32 bytes.
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-1234567890}
    issuer: sso-postgres
    access-token-ttl-seconds: 3600
    api-token-ttl-seconds: 86400
    header-name: Authorization
    token-prefix: "Bearer "
  bootstrap:
    # Seeds a default admin user on first startup so the system is
    # usable out of the box. Idempotent — skips if user already
    # exists. Production deployments should set
    # SSO_BOOTSTRAP_ENABLED=false and provision users via an admin
    # endpoint or migration.
    enabled: ${SSO_BOOTSTRAP_ENABLED:true}
    # Post-V12 the seed key is the email (the legacy
    # `admin-username` slot is gone since the column it pointed
    # at was dropped from the schema). SSO_ADMIN_USERNAME is
    # kept as a fallback alias so an existing .env file silently
    # migrates — the resolver tries `SSO_ADMIN_EMAIL` first, then
    # `SSO_ADMIN_USERNAME` (which we treat as a deprecated
    # human-readable identifier). See DataInitializer.
    admin-email: ${SSO_ADMIN_EMAIL:${SSO_ADMIN_USERNAME:admin@example.com}}
    admin-password: ${SSO_ADMIN_PASSWORD:ChangeMe-Now-Please-123!}
  refresh-token:
    # Lifetime of every refresh token minted by the store. Mirrored
    # to the sso_refresh cookie's Max-Age via RefreshTokenStore.ttlSeconds()
    # so the browser-side hint and the server-side source of truth
    # stay in sync.
    ttl-seconds: 2592000          # 30 days
    # Redis key namespace. MUST stay coupled to the
    # JsonLoginFilter.REFRESH_COOKIE_NAME = "sso_refresh" cookie
    # name — if the cookie name is ever renamed, this prefix must
    # change too. Otherwise a stale cookie from a previous
    # deployment could be replayed against a different prefix.
    key-prefix: sso:refresh
    # fail-open is reserved for emergency / dev-only modes and is
    # always false in production. Setting this to true would let
    # mint() / rotate() succeed even when Redis is unreachable,
    # defeating the entire fix. Left here as an explicit switch so
    # the failure mode is visible in the config rather than hidden
    # in code.
    fail-open: false
  session:
    user-roles:
      # TTL for the cached effective-roles set. Matches the
      # access-token lifetime (3600s) so a fresh login re-reads
      # roles and any subsequent request within the window reads
      # the cached set. Admin services invalidate explicitly on
      # every binding mutation — see the SessionInvalidationClient
      # in sso-admin.
      ttl-seconds: 3600
      # Redis key namespace for the role-set cache. Distinct from
      # sso:refresh:* so the two caches' lifecycles are
      # independent (e.g. a FLUSHDB scoped to one prefix doesn't
      # affect the other).
      key-prefix: sso:session:user-roles
      # Shared secret that gates POST /internal/cache/user-roles/{email}.
      # sso-admin includes it as the X-Session-Cache-Secret header
      # after every role / group binding mutation. MUST be set
      # identically in auth-center and sso-admin — the env var
      # SSO_SESSION_USER_ROLES_INVALIDATION_SECRET is the canonical
      # carrier (the long form matches Spring relaxed binding of the
      # property path sso.session.user-roles.invalidation-secret that
      # SessionInvalidationClient uses on the sso-admin side, so a
      # single env var feeds both services).
      invalidation-secret: ${SSO_SESSION_USER_ROLES_INVALIDATION_SECRET:}
      # Master switch for the cache. Production must leave this
      # true. Tests override it to false via @TestPropertySource so
      # cached role sets from one test method don't leak into the
      # next when the user table is reseeded.
      enabled: true
      # TTL for the @Cacheable("user-by-email") backing
      # GET /getInfoUser. Short (60s) so a disabled / re-enabled
      # user is reflected within a minute without an explicit
      # eviction hop. The cache lives in auth-center only — there
      # is no cross-service writer to invalidate from.
      user-by-email-ttl-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
    resource-attributes:
      service.namespace: sso
      deployment.environment: ${DEPLOY_ENV:dev}
  tracing:
    enabled: true
    sampling:
      probability: ${OTEL_TRACING_SAMPLE_RATE:1.0}

logging:
  level:
    root: INFO
    com.co.eurekatic: INFO
