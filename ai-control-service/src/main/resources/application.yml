server:
  # 8088 — los ocupados: 8080 gateway, 8081 auth-center, 8082 hello,
  # 8083 sso-admin, 8084 query-service, 8085 notification, 8086 file,
  # 8087 reporting.
  port: ${PORT:8088}
  shutdown: graceful

spring:
  application:
    name: ai-control-service
  main:
    banner-mode: off
  # La llamada al modelo tarda segundos y es bloqueante: un hilo virtual por
  # request la sostiene sin agotar el pool de Tomcat.
  threads:
    virtual:
      enabled: true

  # Sin JPA. El agente usa JdbcClient sobre el schema ai; los datos academicos
  # siguen llegando por HTTP desde el query-service. El starter JPA llega
  # transitivo desde common: sin excluir sus repositorios, al existir un
  # DataSource Spring Data exige un entityManagerFactory que no hay.
  autoconfigure:
    exclude:
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

  # Pool propio y pequeno, solo para el schema ai. DB_URL es host:port (como en
  # docker-compose), por eso el default arma la URL JDBC completa.
  datasource:
    url: '${AI_DB_URL:jdbc:postgresql://${DB_URL:localhost:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}&channel_binding=${DB_CHANNEL_BINDING:prefer}}'
    username: ${AI_DB_USER:${DB_USER:}}
    password: ${AI_DB_PASSWORD:${DB_PASSWORD:}}
    hikari:
      pool-name: ai-agente
      maximum-pool-size: ${AI_DB_POOL_MAX:4}
      minimum-idle: 1
      # Hikari lo lee como long en milisegundos (3 s).
      connection-timeout: 3000
      # Negativo: el pool arranca aunque la base no responda y reintenta en
      # segundo plano. Con el default (1) una base caida tumba el arranque de
      # todo el servicio, tambien de los endpoints que no usan base.
      initialization-fail-timeout: -1

  jackson:
    deserialization:
      fail-on-unknown-properties: false
  web:
    error:
      include-message: always

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  ai:
    # El starter OpenAI trae embeddings, imagen, audio y moderacion. Aqui
    # solo se usa chat: los demas se apagan para que no se creen clientes
    # que nadie usa.
    model:
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      # Cualquier API compatible con OpenAI. Por defecto MiniMax; la base
      # lleva /v1 porque el SDK de OpenAI que usa Spring AI 2 no lo agrega.
      base-url: ${AI_BASE_URL:https://api.minimax.io/v1}
      api-key: ${AI_API_KEY:}
      # En Spring AI 2 los reintentos y el timeout los aplica el SDK de
      # OpenAI; spring.ai.retry.* ya no afecta a este starter.
      # Pasado el timeout se responde 504. Con el plan gratuito de NVIDIA
      # hace falta 120s (cola de hasta ~110s hasta el primer token).
      timeout: ${AI_TIMEOUT:120s}
      max-retries: ${AI_MAX_RETRIES:1}
      chat:
        model: ${AI_MODEL:MiniMax-M3}
        # Explicito: NVIDIA responde error si falta, y acota el costo en todos.
        max-tokens: ${AI_MAX_TOKENS:1500}
        temperature: ${AI_TEMPERATURE:0.6}
        top-p: ${AI_TOP_P:0.95}
    tools:
      observations:
        # Los argumentos y resultados de herramientas pueden llevar datos de
        # estudiantes: las observaciones solo llevan metadatos.
        include-content: false
    chat:
      # Nunca loguear prompt ni respuesta: son observaciones de menores.
      observations:
        log-prompt: false
        log-completion: false
      client:
        observations:
          log-prompt: false
          log-completion: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: false
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

sso:
  ai:
    # Directo al query-service del catalogo eval-col, no al gateway.
    query-service-base-url: ${AI_QUERY_SERVICE_URL:http://query-service-eval-col:8084}
    request-timeout: ${AI_QUERY_TIMEOUT:30s}
    # Campos del proveedor fuera del estandar OpenAI. El default apaga el
    # razonamiento de MiniMax-M3, que viene encendido. Cada proveedor usa su
    # propia clave: MiniMax thinking.type, Nemotron (NVIDIA)
    # chat_template_kwargs.enable_thinking.
    extra-body-json: '${AI_EXTRA_BODY_JSON:{"thinking":{"type":"disabled"}}}'
    max-palabras: ${AI_MAX_PALABRAS:250}
    prompt-version: ${AI_PROMPT_VERSION:v2}
    cache-ttl: ${AI_CACHE_TTL:7d}
    rate-limit-per-min: ${AI_RATE_LIMIT_PER_MIN:35}
    rate-limit-timeout: ${AI_RATE_LIMIT_TIMEOUT:20s}
    max-concurrent: ${AI_MAX_CONCURRENT:4}
    circuit-failure-rate: ${AI_CIRCUIT_FAILURE_RATE:50}
    circuit-open-wait: ${AI_CIRCUIT_OPEN_WAIT:60s}
    agente:
      modelos:
        # Rapido: router, clasificador y redaccion, sin razonamiento. Nunca
        # ejecuta herramientas de escritura.
        rapido:
          nombre: ${AI_MODEL_FAST:${AI_MODEL:MiniMax-M3}}
          extra-body-json: '${AI_EXTRA_BODY_FAST_JSON:{"thinking":{"type":"disabled"}}}'
          max-tokens: ${AI_MAX_TOKENS_FAST:1500}
        # Razonador: planea y elige herramientas. El tope incluye los tokens de
        # razonamiento: con 1500 se corta antes de elegir herramienta.
        razonador:
          nombre: ${AI_MODEL_REASONING:${AI_MODEL:MiniMax-M3}}
          extra-body-json: '${AI_EXTRA_BODY_REASONING_JSON:{"thinking":{"type":"adaptive"},"reasoning_split":true}}'
          max-tokens: ${AI_MAX_TOKENS_REASONING:6000}
      limites:
        max-total-tool-calls: ${AI_AGENTE_MAX_TOOL_CALLS:15}
        max-calls-por-herramienta: ${AI_AGENTE_MAX_CALLS_POR_HERRAMIENTA:5}
        rate-limit-usuario-por-min: ${AI_AGENTE_RATE_LIMIT_USUARIO_POR_MIN:20}
        texto-max-caracteres: ${AI_AGENTE_TEXTO_MAX_CARACTERES:4000}
        max-concurrent-razonador: ${AI_AGENTE_MAX_CONCURRENT_REASONING:2}
      memoria:
        max-mensajes: ${AI_AGENTE_MEMORIA_MAX_MENSAJES:30}
        ttl: ${AI_AGENTE_MEMORIA_TTL:24h}
      acciones:
        expira: ${AI_AGENTE_ACCION_EXPIRA:10m}
  jwt:
    # Solo la publica: este servicio verifica firmas, no emite tokens.
    public-key: ${JWT_PUBLIC_KEY}
    issuer: sso-postgres
    header-name: Authorization
    token-prefix: "Bearer "

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # Redis es una cache opcional: su caida no debe tumbar el health y sacar
  # la instancia de Eureka.
  health:
    redis:
      enabled: false
    # La base solo la usa el agente. Si cae, el servicio sigue atendiendo
    # observaciones; el agente responde error y el healthcheck no se rompe.
    db:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
    resource-attributes:
      service.namespace: sso
      deployment.environment: ${DEPLOY_ENV:dev}
  logging:
    export:
      otlp:
        enabled: ${MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED:false}
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLE_RATE:1.0}
    export:
      enabled: ${MANAGEMENT_TRACING_EXPORT_ENABLED:false}

logging:
  level:
    com.co.eurekatic.aicontrol: ${AI_LOG_LEVEL:INFO}
