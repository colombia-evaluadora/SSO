name: Bug
description: Reportar un comportamiento roto del sistema SSO.
title: "[bug] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ### Antes de abrir un bug
        - Busca en [issues existentes](https://github.com/djromerom/sso_postgres/issues)
          para evitar duplicados.
        - Verifica contra la última `main`, no contra una rama vieja.
        - Si afecta a varios módulos, este es el lugar; si es de UI,
          adjunta una captura.

  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Dónde lo viste correr
      placeholder: "docker compose local / staging / prod / CI runner"
    validations:
      required: true

  - type: input
    id: modulo
    attributes:
      label: Módulo afectado
      description: "uno de: common / auth-center / sso-admin / api-gateway / admin-ui / provisioner / query-service / postgres-migrations"
      placeholder: "sso-admin"
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: Endpoint o pantalla
      description: Ruta exacta o nombre de la página/componente
      placeholder: "POST /sso-admin/updateAccount"
    validations:
      required: false

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Lista numerada, paso a paso, exacta
      placeholder: |
        1. Login con admin@example.com
        2. Crear usuario vía /sso-admin/createAccount
        3. Activar vía enlace del correo
        4. Logout + login con el usuario nuevo
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
      description: Qué debería pasar
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: Qué pasa (con mensaje de error / código HTTP / screenshot)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Pega el fragmento relevante — NO credenciales ni tokens.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: intentos
    attributes:
      label: Diagnóstico básico
      description: Confirma lo siguiente antes de pedir ayuda
      options:
        - label: "Es contra `main` reciente, no contra una rama vieja"
          required: false
        - label: "Reproduje con `docker compose` limpio (volúmenes recreados)"
          required: false
        - label: "Busqué en issues existentes y no encontré duplicado"
          required: false
