# =============================================================================
# deploy.yml — workflow REUTILIZABLE que despliega el stack a un servidor.
#
# No se dispara solo: lo invocan `deploy-test.yml` (push a dev -> servidor de
# pruebas) y `release.yml` (tag v* en main -> servidor de produccion). Toda la
# logica de despliegue vive AQUI y solo aqui.
#
# ---- Por que reutilizable y no dos copias ----------------------------------
#
# El cuerpo del despliegue son ~400 lineas de bash afinado: arranque en frio
# contra redeploy en caliente, migraciones ANTES de recrear servicios
# (scripts/flyway-deploy.sh: re-aplica las editadas antes de las pendientes),
# smoke check. Duplicarlo
# para un segundo entorno garantiza que en unos meses las dos copias divergen
# y la de produccion es la vieja. Ya paso con ci.yml: existe un commit
# llamado "ci(deploy): sincronizar workflow de test con dev".
#
# ---- Secretos: por ENTORNO, no por repositorio -----------------------------
#
# Los nombres son IDENTICOS en `test` y en `production`; lo que cambia es el
# valor. Eso es lo que permite que este fichero no sepa a que servidor apunta:
#
#   SSH_TARGET   usuario@host del servidor. Fusiona los antiguos TEST_SSH_USER
#                y TEST_SSH_HOST, que el workflow ya concatenaba en sus cinco
#                usos; el unico sitio que necesitaba el host suelto es el
#                ssh-keyscan, y ahi sale con ${SSH_TARGET#*@}.
#   SSH_KEY      clave privada OpenSSH, exclusiva para deploy.
#   ENV_FILE     contenido completo de /opt/sso/.env.
#
# Se pueblan con ./scripts/setup-environment-secrets.sh.
#
# NO HAY SECRETOS DE REPOSITORIO. Todo lo que este workflow necesita sale del
# environment (o es el GITHUB_TOKEN que GitHub inyecta solo). Dos cosas que
# antes eran secretos de repo y ya no:
#
#   GHCR_PULL_USER / GHCR_PULL_TOKEN — el `docker login` del servidor usa el
#     GITHUB_TOKEN efimero del propio job, que caduca al terminar.
#
#   SMTP_ZEPTOMAIL_USER / SMTP_ZEPTOMAIL_PASS — viajaban en un paso aparte que
#     las anadia al .env despues de escribirlo. Su razon de ser era que rotar
#     el token no obligara a reconstruir a ciegas un secreto de 170 lineas.
#     Con setup-environment-secrets.sh esa objecion desaparece: `--from-server`
#     lee el .env vigente del servidor y lo re-sube entero, asi que rotar es
#     editar la linea en el servidor y correr un comando. Las credenciales
#     entran ahora dentro de ENV_FILE como cualquier otra.
#
#     Contrapartida asumida: rotarlas ya no es un `gh secret set` suelto.
#
# ---- Rollback --------------------------------------------------------------
#
# Cada deploy publica ademas un tag inmutable por SHA (o el tag de version en
# un release). En el servidor: editar IMAGE_TAG en /opt/sso/.env y
# `docker compose up -d`.
# =============================================================================

name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment del que salen los secretos (test | production).'
        required: true
        type: string
      ref:
        description: 'Commit o tag a desplegar. Debe ser el MISMO que construyo las imagenes.'
        required: true
        type: string
      image_tag:
        description: 'Tag de imagen que el servidor debe correr (test-latest, v1.2.3...). Se fija en IMAGE_TAG del .env remoto.'
        required: true
        type: string
      changed_services:
        description: >-
          Array JSON de los servicios cuya imagen cambio, para el redeploy en
          caliente. En un release va la lista completa: se despliega todo.
        required: false
        type: string
        default: '[]'
      reapply_since:
        description: >-
          Commit o tag desde el que re-aplicar las migraciones ya aplicadas que
          cambiaron (git diff). Vacio = el ultimo commit cuyas migraciones
          quedaron aplicadas en el servidor (/opt/sso/.flyway-deployed-ref).
          Hace falta una vez por servidor, mientras ese fichero no exista.
        required: false
        type: string
        default: ''
      reapply:
        description: 'Versiones extra a re-aplicar, separadas por comas (V428,V223).'
        required: false
        type: string
        default: ''

# packages: read es lo que habilita que el GITHUB_TOKEN sirva para el
# `docker login ghcr.io` del servidor. contents: read, para el checkout.
permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # El environment aporta DOS cosas, no una: de el salen los secretos, y el
    # son sus reglas de proteccion. `production` exige revisor y solo admite
    # tags v*, asi que un release se para aqui hasta que alguien lo aprueba.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # Historial completo: el paso "Migraciones editadas" hace git diff
          # contra el commit del último deploy, que puede ser de hace semanas.
          fetch-depth: 0

      - name: Setup SSH
        # SSH_KEY y SSH_TARGET entran como variables de entorno, no
        # interpoladas dentro del script: una clave privada expandida
        # en el cuerpo de un `run:` acaba en el fichero temporal que el
        # runner escribe en disco, y basta un `set -x` de más para que
        # salga en el log. Como env var no la imprime nadie.
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
        run: |
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SSH_TARGET:-}" ]; then
            echo "::error::Faltan SSH_KEY o SSH_TARGET en el entorno '${{ inputs.environment }}'."
            echo "Puéblalos con: ./scripts/setup-environment-secrets.sh ${{ inputs.environment }} ..."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # SSH_TARGET es 'usuario@host'; keyscan sólo quiere el host.
          ssh-keyscan -H "${SSH_TARGET#*@}" >> ~/.ssh/known_hosts

      - name: Migraciones editadas desde el último deploy
        # Qué migraciones YA aplicadas cambiaron desde el último deploy que
        # dejó las migraciones al día en este servidor. El checksum de
        # flyway_schema_history no sirve para esto por sí solo: un `flyway
        # repair` lo realinea sin re-ejecutar nada, y a partir de ahí la
        # edición es invisible (las 42 editadas de v1.1.56/57 en producción).
        # git diff contra el commit desplegado, en cambio, no se borra.
        #
        # La lista va al servidor; scripts/flyway-deploy.sh la cruza con lo
        # aplicado y la re-ejecuta ANTES de las pendientes. Va antes de
        # sincronizar nada: si falta la base en producción, el deploy para
        # aquí sin haber tocado el servidor.
        id: reapply
        env:
          DEST: ${{ secrets.SSH_TARGET }}
          REAPPLY_SINCE: ${{ inputs.reapply_since }}
          REAPPLY_EXTRA: ${{ inputs.reapply }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          MARKER="$(ssh -i ~/.ssh/deploy_key "$DEST" 'cat /opt/sso/.flyway-deployed-ref 2>/dev/null || true' | tr -d '[:space:]')"
          echo "Último commit con migraciones al día en el servidor: ${MARKER:-<sin marca>}"
          BASE="${REAPPLY_SINCE:-$MARKER}"

          CANDIDATES=""
          if [ -z "$BASE" ]; then
            if [ "$TARGET_ENV" = "production" ]; then
              # Sin marca, el único detector es el checksum, que un repair
              # previo pudo haber pisado. En producción no se adivina.
              echo "::error::El servidor no tiene /opt/sso/.flyway-deployed-ref. Relanza Release (workflow_dispatch) con 'reapply_since' = el último tag que se desplegó BIEN en producción."
              exit 1
            fi
            echo "::warning::Sin marca de último deploy: solo se re-aplican las migraciones con checksum cambiado."
          else
            if ! printf '%s' "$BASE" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._/-]*$' \
               || ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
              if [ -n "$REAPPLY_SINCE" ] || [ "$TARGET_ENV" = "production" ]; then
                echo "::error::'$BASE' no es un commit/tag de este repo."
                exit 1
              fi
              echo "::warning::La marca '$BASE' ya no existe en el repo (¿force-push?): solo checksum."
            else
              # Que lo nuevo y lo editado se QUEDEN, contra lo que este
              # servidor tiene de verdad y antes de sincronizar nada:
              #  * nueva (A) pisada por una posterior: entra out-of-order,
              #    corre la última y revierte lo posterior; el servidor queda
              #    distinto de una base limpia -> se para.
              #  * editada (M) pisada: la expansión re-ejecuta la posterior
              #    detrás, así que el servidor queda igual que una base limpia
              #    y la edición es código muerto -> aviso (CI lo bloquea en el
              #    PR, que es donde se corrige).
              ORDEN_JSON="$(mktemp)"
              ORDEN_RC=0
              PYTHONIOENCODING=utf-8 python3 scripts/migration-analysis orden --base "$BASE" --json "$ORDEN_JSON" || ORDEN_RC=$?
              # rc=1 con JSON = hay hallazgos (se clasifican abajo); rc!=0 sin
              # JSON = el analizador se cayó, y eso no se deja pasar.
              if [ "$ORDEN_RC" != 0 ] && ! jq -e 'type == "array"' "$ORDEN_JSON" >/dev/null 2>&1; then
                echo "::error::el análisis de orden falló (rc=$ORDEN_RC) sin dar resultado"
                exit 1
              fi
              if [ -s "$ORDEN_JSON" ]; then
                jq -r '.[] | select(.estado == "M")
                       | "::warning::\(.fichero): \(.objeto) lo redefine V\(.pisada_por); la edición no tendrá efecto"' "$ORDEN_JSON"
                NUEVAS_PISADAS="$(jq -r '.[] | select(.estado != "M") | "\(.fichero) (\(.objeto), lo redefine V\(.pisada_por))"' "$ORDEN_JSON")"
                if [ -n "$NUEVAS_PISADAS" ]; then
                  echo "::error::migraciones nuevas que revertirían lo posterior en este servidor:"
                  printf '  %s\n' "$NUEVAS_PISADAS"
                  exit 1
                fi
              fi
              CANDIDATES="$(git diff --name-only --diff-filter=AMR "$BASE" HEAD -- postgres/migrations \
                            | grep -E '^postgres/migrations/V[0-9]+(\.[0-9]+)*__[A-Za-z0-9_.-]+\.sql$' \
                            | xargs -r -n1 basename | tr '\n' ' ' || true)"
            fi
          fi

          for v in $(printf '%s' "$REAPPLY_EXTRA" | tr ',' ' '); do
            if ! printf '%s' "$v" | grep -qE '^V?[0-9]+(\.[0-9]+)*$'; then
              echo "::error::'$v' en 'reapply' no es una versión (V428, 496.3)."
              exit 1
            fi
            CANDIDATES="$CANDIDATES V${v#V}"
          done
          # Se expande aquí (el runner siempre tiene python3; el servidor no
          # está garantizado) con las posteriores que redefinen lo mismo.
          if [ -n "${CANDIDATES// /}" ]; then
            # shellcheck disable=SC2086  # una lista de basenames, a propósito
            CANDIDATES="$(python3 scripts/migration-reapply-set.py $CANDIDATES | tr '\n' ' ')"
          fi
          echo "Candidatas a re-aplicar (el servidor descarta las no aplicadas): ${CANDIDATES:-<ninguna>}"
          echo "candidates=$CANDIDATES" >> "$GITHUB_OUTPUT"

      - name: Sync compose + configs
        # El compose monta rutas relativas (./postgres/migrations,
        # ./observability/**, ./docker/**), así que el servidor necesita esos
        # archivos junto al docker-compose.yml. --delete mantiene
        # migrations/ y observability/ como espejo del repo; el .env
        # del servidor NO se toca (vive en /opt/sso y no está en la
        # lista de origen).
        env:
          DEST: ${{ secrets.SSH_TARGET }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEST" "mkdir -p /opt/sso/postgres/migrations /opt/sso/observability /opt/sso/docker /opt/sso/scripts"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" docker-compose.yml \
            "$DEST:/opt/sso/docker-compose.yml"
          # docker-compose.cdc-off.yml lo aplica el wrapper
          # ./scripts/sso-stack.sh cuando CDC_SYNC_ENABLED=false. Sin
          # este fichero en el server, el deploy con el flag apagado
          # cae con "no such file or directory" en `docker compose -f`.
          rsync -az -e "ssh -i ~/.ssh/deploy_key" docker-compose.cdc-off.yml \
            "$DEST:/opt/sso/docker-compose.cdc-off.yml"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" postgres/migrations/ \
            "$DEST:/opt/sso/postgres/migrations/"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" observability/ \
            "$DEST:/opt/sso/observability/"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" docker/ \
            "$DEST:/opt/sso/docker/"
          # El wrapper ./scripts/sso-stack.sh lo invoca el paso "Pull &
          # restart stack" para que CDC_SYNC_ENABLED / SSO_TELEMETRY_ENABLED
          # se honren en el deploy. Sin él el deploy cae con exit 127.
          # `--chmod=u+rwx,go+rx` fuerza 755 en el server: por defecto
          # rsync conserva los permisos del repo (644), y sin el bit
          # +x el deploy cae con exit 126 ("permission denied").
          rsync -az --chmod=u+rwx,go+rx -e "ssh -i ~/.ssh/deploy_key" scripts/ \
            "$DEST:/opt/sso/scripts/"
          # Defensa adicional: si el rsync quedó con umask raro, re-fija
          # el bit de ejecución del wrapper antes de invocarlo. Si ya
          # está bien, no hace daño.
          ssh -i ~/.ssh/deploy_key "$DEST" \
            "chmod 755 /opt/sso/scripts/sso-stack.sh 2>/dev/null || true"

      - name: Deploy .env from GitHub secret
        # El .env ya no se crea "a mano" en el servidor: vive como
        # secreto del entorno (ENV_FILE) y se escribe aquí en cada
        # deploy. Con esto, rotar una credencial es editar el secreto
        # y re-desplegar — no entrar por SSH — y deja de haber un
        # fichero en el host que nadie sabe qué contiene ni cuándo
        # cambió.
        #
        # Disciplina de manejo, igual que el token de GHCR de abajo:
        #   - el contenido viaja por STDIN, nunca en argv ni
        #     interpolado dentro del script (argv es visible en
        #     `ps` y se filtraría con `set -x`);
        #   - `umask 077` para que nazca 600, no 644;
        #   - se escribe a un temporal y se mueve, así un corte a
        #     mitad no deja un .env truncado capaz de tumbar el stack
        #     en el `compose up` siguiente;
        #   - el log sólo reporta el número de líneas, nunca el
        #     contenido.
        env:
          DEST: ${{ secrets.SSH_TARGET }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "${ENV_FILE:-}" ]; then
            echo "::error::Falta el secreto ENV_FILE del entorno '${{ inputs.environment }}'."
            echo "Debe contener el .env completo del servidor, incluidas las"
            echo "variables de V30/V33 (SSO_INTERNAL_TOKEN, GATEWAY_INTERNAL_TOKEN,"
            echo "QUERY_CATALOG_INTERNAL_TOKEN, QUERY_SERVICE_BASE_URL, …)."
            exit 1
          fi
          printf '%s' "$ENV_FILE" | ssh -i ~/.ssh/deploy_key "$DEST" \
            'umask 077 && cat > /opt/sso/.env.new && mv /opt/sso/.env.new /opt/sso/.env'

          # IMAGE_TAG lo manda el llamador, NO el secreto. El .env
          # guardado trae el tag que estuviera vigente cuando se subió, y
          # en un release eso es justo lo que no queremos: el tag tiene
          # que ser el de ESTA versión (v1.2.3), no el que había el día
          # que alguien actualizó el secreto. Dejarlo dentro de ENV_FILE
          # obligaría a re-subir el secreto entero en cada release.
          #
          # Se borra y se re-añade para que la línea exista una sola vez
          # gane quien gane en el fichero base.
          ssh -i ~/.ssh/deploy_key "$DEST" \
            "sed -i '/^IMAGE_TAG=/d' /opt/sso/.env && \
             printf '\nIMAGE_TAG=%s\n' '${{ inputs.image_tag }}' >> /opt/sso/.env"

          ssh -i ~/.ssh/deploy_key "$DEST" \
            'echo ".env desplegado: $(grep -c . /opt/sso/.env) líneas no vacías, permisos $(stat -c %a /opt/sso/.env)"'
          echo "IMAGE_TAG fijado a '${{ inputs.image_tag }}'"

      - name: Pull & restart stack
        # Cold-cache JVM starts on a 4GB Linode take 60-90s
        # for the provisioner (the heaviest of the bunch);
        # the cascade through sso-admin → query-service adds
        # another 2-3 min. GitHub's default step timeout is
        # 360 min, but the file was being interpreted as 4 min
        # by an older runner config; bump explicitly to 15
        # min so the deploy can wait the full cold-start
        # window without bailing.
        timeout-minutes: 15
        env:
          DEST: ${{ secrets.SSH_TARGET }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          # Lista de servicios cuya imagen cambió en este deploy (ya
          # filtrada por el job `changes` contra el diff real). La usa el
          # redeploy "en caliente" de más abajo para saber qué recrear sin
          # pasarle el JSON crudo al shell remoto.
          CHANGED_SERVICES_JSON: ${{ inputs.changed_services }}
          # Validadas en el paso anterior: basenames V<n>__[A-Za-z0-9_.-]+.sql y
          # un SHA hexadecimal, seguros de interpolar en la linea remota.
          REAPPLY_CANDIDATES: ${{ steps.reapply.outputs.candidates }}
          DEPLOY_SHA: ${{ steps.reapply.outputs.sha }}
        run: |
          # Login a GHCR en el servidor con el GITHUB_TOKEN EFÍMERO de este
          # job (habilitado por `permissions: packages: read` arriba).
          #
          # Antes esto usaba GHCR_PULL_TOKEN: un PAT clásico de una cuenta
          # personal, creado en julio y sin rotar desde entonces, que además
          # quedaba cacheado indefinidamente en ~/.docker/config.json del
          # servidor. Es decir, una credencial de larga vida ligada a una
          # persona, viviendo en disco en la máquina desplegada.
          #
          # El GITHUB_TOKEN caduca cuando termina el job, así que no deja
          # nada permanente en el servidor y no hay PAT que rotar.
          #
          # Contrapartida asumida: un `docker compose pull` a mano en el
          # servidor ya no funciona sin volver a autenticarse. Es deliberado
          # — los pulls los hace el pipeline.
          #
          # El token va por stdin, nunca en argv ni en el heredoc.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$DEST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          # JSON → lista separada por espacios. Los nombres vienen de un
          # whitelist fijo en el job `changes` (case/add() ahí), así que son
          # seguros para interpolar en la línea de comando remota de abajo
          # (sin espacios, sin metacaracteres de shell).
          CHANGED_SERVICES="$(echo "$CHANGED_SERVICES_JSON" | jq -r 'join(" ")')"
          echo "Servicios cuya imagen cambió: ${CHANGED_SERVICES:-<ninguno>}"

          # CHANGED_SERVICES (y REAPPLY_CANDIDATES / DEPLOY_SHA) viajan como
          # variables de entorno del comando remoto (no dentro del
          # heredoc, que va comillado a propósito
          # para que $DEST, $(...) etc. de las líneas de abajo se evalúen
          # en el servidor y no aquí).
          #
          # Todo el cuerpo va dentro de una función que se llama en la última
          # línea con stdin en /dev/null: bash lee la función ENTERA antes de
          # ejecutar nada, así que un comando que lea stdin (docker exec -i,
          # compose run) ya no puede tragarse el resto del heredoc. Pasó con
          # la fase de migraciones: el deploy salía en verde tras flyway sin
          # recrear servicios ni escribir la marca.
          ssh -i ~/.ssh/deploy_key "$DEST" "CHANGED_SERVICES='$CHANGED_SERVICES' REAPPLY_CANDIDATES='$REAPPLY_CANDIDATES' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'EOF'
          set -euo pipefail
          deploy_remoto() {
          cd /opt/sso
          # El .env lo acaba de escribir el paso anterior desde el
          # secreto TEST_ENV_FILE. Si no está, ese paso falló y no
          # deberíamos haber llegado aquí — el guard se queda como
          # red de seguridad.
          test -f .env || { echo "FALTA /opt/sso/.env — el paso 'Deploy .env' no lo escribió"; exit 1; }
          # Wrapper en vez de `docker compose` directo: aplica los
          # overrides según .env (CDC_SYNC_ENABLED, SSO_TELEMETRY_ENABLED).
          # Sin esto, poner CDC_SYNC_ENABLED=false en TEST_ENV_FILE no
          # apagaría los servicios CDC en el deploy automático — el
          # override `docker-compose.cdc-off.yml` no se concatenaría.
          # --ignore-buildable salta garage-init (perfil "storage"):
          # tiene build: Y image: en docker-compose.yml a propósito
          # (build local porque la imagen oficial es `scratch`, sin
          # shell — ver el comentario ahí), y sin este flag `pull`
          # intenta descargarlo de un registro donde no existe y
          # aborta con "pull access denied" ANTES de tocar ningún
          # contenedor real. `docker compose up` sigue construyéndolo
          # normal si hace falta (docker/garage/Dockerfile.init).
          #
          # BUG real encontrado en vivo (V377, incidente de sesiones
          # PIGSE/CEVAL mezcladas): --ignore-buildable no solo salta
          # garage-init -- salta CUALQUIER servicio que declare build:
          # Y image: a la vez, que es prácticamente TODO servicio propio
          # de este repo (auth-center, cdc-worker, cdc-capture, etc. --
          # todos tienen build: para desarrollo local). Resultado: este
          # `pull` nunca trae la imagen nueva para ninguno de ellos, y
          # el `compose up -d --no-deps` de más abajo ve la misma imagen
          # ya cacheada de la vez anterior y no recrea nada -- reporta
          # "Container ... Running" en vez de "Recreated", en silencio,
          # sin que el deploy falle ni lo diga. Así quedó corriendo
          # código de auth-center/cdc-worker viejo por horas pese a un
          # "deploy to test" en verde. IMAGE_PREFIX_VAL/IMAGE_TAG_VAL se
          # adelantan acá (antes solo existían más abajo, para
          # query-service) para poder pullear explícitamente, por fuera
          # de compose, cada servicio de $CHANGED_SERVICES que SÍ vive
          # en docker-compose.yml -- el mismo truco que ya se usaba solo
          # para query-service, generalizado.
          IMAGE_PREFIX_VAL="$(grep -E '^IMAGE_PREFIX=' .env 2>/dev/null | tail -n1 | cut -d= -f2- | tr -d '\r')"
          IMAGE_TAG_VAL="$(grep -E '^IMAGE_TAG=' .env 2>/dev/null | tail -n1 | cut -d= -f2- | tr -d '\r')"
          IMAGE_PREFIX_VAL="${IMAGE_PREFIX_VAL:-eurekatic}"
          IMAGE_TAG_VAL="${IMAGE_TAG_VAL:-1.0.0-SNAPSHOT}"

          ./scripts/sso-stack.sh pull --quiet --ignore-buildable

          # En paralelo: en serie eran ~5 s por imagen (≈1 min en un release
          # de 13). Cada pull escribe a su propio log y se espera a TODOS: uno
          # que falle tumba el deploy igual que antes, con su salida.
          PULL_LOGS="$(mktemp -d)"
          PULL_PIDS=""
          for svc in $CHANGED_SERVICES; do
            if [ "$svc" = "query-service" ]; then
              continue
            fi
            echo "=== pre-pulling ${IMAGE_PREFIX_VAL}/${svc}:${IMAGE_TAG_VAL} (compose ignora este pull por --ignore-buildable, se hace a mano) ==="
            docker pull -q "${IMAGE_PREFIX_VAL}/${svc}:${IMAGE_TAG_VAL}" > "$PULL_LOGS/$svc.log" 2>&1 &
            PULL_PIDS="$PULL_PIDS $!:$svc"
          done

          # `query-service` NO es un servicio de docker-compose.yml (se
          # provisiona en caliente vía Docker Engine API, ver
          # provisioner/DockerSocket.createAndStart): "compose pull" de
          # arriba nunca lo toca, y DockerSocket llama directo a
          # POST /containers/create SIN pull previo — si la imagen no
          # está ya cacheada en el host, containers/create devuelve
          # "No such image" (la API cruda de Docker, a diferencia de
          # `docker run`, no hace pull implícito). Resultado sin este
          # paso: el primer "Nuevo query service" / "Recrear" contra un
          # servidor recién desplegado falla siempre, de forma
          # determinista, porque nadie pulleó la imagen todavía.
          #
          # La pulleamos aquí, explícitamente, mientras el login a GHCR
          # de arriba (GITHUB_TOKEN efímero del job) sigue vigente — es
          # la única ventana en la que el servidor puede autenticarse
          # contra el registry. IMAGE_PREFIX/IMAGE_TAG son las mismas
          # variables que consume DOCKER_IMAGE del servicio `provisioner`
          # en docker-compose.yml, así que la imagen pulleada aquí es
          # exactamente la que provisioner le pide a Docker más tarde.
          echo "=== pre-pulling ${IMAGE_PREFIX_VAL}/query-service:${IMAGE_TAG_VAL} (provisionado on-demand, fuera de docker-compose.yml) ==="
          docker pull -q "${IMAGE_PREFIX_VAL}/query-service:${IMAGE_TAG_VAL}" > "$PULL_LOGS/query-service.log" 2>&1 &
          PULL_PIDS="$PULL_PIDS $!:query-service"

          PULL_FAIL=""
          for p in $PULL_PIDS; do
            wait "${p%%:*}" || PULL_FAIL="$PULL_FAIL ${p#*:}"
          done
          if [ -n "$PULL_FAIL" ]; then
            for s in $PULL_FAIL; do echo "--- pull $s ---"; cat "$PULL_LOGS/$s.log"; done
            echo "::error::falló el pull de:$PULL_FAIL"
            exit 1
          fi
          rm -rf "$PULL_LOGS"

          # ─── Servicios gateados por flyway vs. servicios independientes ───
          #
          # Calculado una vez con `docker compose config --format json` +
          # BFS sobre `depends_on` hasta `flyway` (no a ojo — dos servicios
          # que "suenan" a que dependen del esquema, file-service y
          # reporting-service, en realidad NO tienen depends_on:flyway en
          # docker-compose.yml hoy). Si el grafo de dependencias cambia,
          # recalcular con ese mismo comando.
          #
          #   GATED_SERVICES   → arrastran flyway transitivamente
          #                       (auth-center/sso-admin lo declaran
          #                       directo; api-gateway lo hereda de ambos).
          #   INFRA_SERVICES   → imágenes de terceros que no leen el esquema
          #                       de la aplicación. Se levantan antes de
          #                       migrar, gate o no gate.
          #   APP_SERVICES     → imágenes propias sin depends_on:flyway. Van
          #                       DESPUÉS de las migraciones, igual que las
          #                       gateadas: antes estaban en INFRA y se
          #                       recreaban con código nuevo contra el
          #                       esquema viejo (y si flyway fallaba se
          #                       quedaban así), y la fase de migraciones
          #                       esperaba ~40 s a que eureka quedara healthy.
          GATED_SERVICES="api-gateway auth-center cdc-capture cdc-pg-slot-init notification-service sso-admin"
          INFRA_SERVICES="cdc-clickhouse mailhog rabbitmq redis tsesion-web-gc alloy grafana loki mimir tempo"
          APP_SERVICES="cdc-worker eurekaserver file-service provisioner reporting-service ai-control-service"

          # Filtra una lista de servicios contra el grafo ACTIVO de compose
          # (respeta COMPOSE_PROFILES ya resuelto por sso-stack.sh: si
          # observability o cdc-sync están apagados en .env, sus servicios
          # no están en este listado y no los forzamos a arrancar
          # nombrándolos explícitamente).
          active_services() { ./scripts/sso-stack.sh config --services 2>/dev/null; }
          ACTIVE="$(active_services)"
          filter_active() {
            local out=""
            for s in "$@"; do
              echo "$ACTIVE" | grep -qx "$s" && out="${out:+$out }$s"
            done
            echo "$out"
          }

          INFRA_TO_START="$(filter_active $INFRA_SERVICES)"
          echo "=== infraestructura sin dependencia de flyway (siempre primero) ==="
          echo "Servicios: ${INFRA_TO_START:-<ninguno activo>}"
          if [ -n "$INFRA_TO_START" ]; then
            ./scripts/sso-stack.sh up -d --remove-orphans $INFRA_TO_START
          fi

          up_stack() { ./scripts/sso-stack.sh up -d --remove-orphans; }

          # Lee un valor del .env del servidor sin `source` (los valores
          # pueden traer espacios/comillas que romperían el shell).
          _envval() { sed -n "s/^$1=//p" /opt/sso/.env 2>/dev/null | head -1 | tr -d '\r'; }

          dump_logs() {
            echo "=== flyway logs (last 200) ==="
            docker compose logs --no-color --tail=200 flyway || true
            echo "=== auth-center logs (last 50) ==="
            docker compose logs --no-color --tail=50 auth-center || true
            echo "=== compose ps ==="
            docker compose ps || true
          }

          # ─── Migraciones: SIEMPRE antes de tocar los servicios ───
          #
          # Antes flyway corría al final y, en un redeploy en caliente, los
          # servicios nuevos ya estaban recreados "sin esperar a flyway". Si
          # flyway fallaba quedaba código nuevo contra esquema viejo, sin
          # vuelta atrás: pasó con v1.1.56 y v1.1.57 (prod en V531 con
          # servicios v1.1.57). Ahora, si esta fase falla, el deploy sale
          # aquí y el stack sigue entero en la versión anterior.
          #
          # Lo que se pierde: durante el migrate el código VIEJO corre contra
          # el esquema nuevo. Es la dirección segura (las migraciones añaden
          # columnas/funciones y reescriben cuerpos con CREATE OR REPLACE), y
          # dura lo que tarde flyway, no indefinidamente.
          #
          # La fase entera (detectar editadas, re-aplicarlas ANTES de las
          # pendientes, repair, migrate, validate) vive en
          # scripts/flyway-deploy.sh, que ci.yml (job flyway-upgrade) prueba
          # contra una base en el estado del último release.

          # En un arranque en frío nadie levanta el Postgres local antes que
          # flyway (no está en INFRA_SERVICES): se arranca aquí si está activo.
          PG_TO_START="$(filter_active postgres)"
          if [ -n "$PG_TO_START" ]; then
            ./scripts/sso-stack.sh up -d $PG_TO_START
          fi

          # La re-aplicación va por psql DENTRO de sso-postgres, así que flyway
          # tiene que estar migrando ese contenedor. Se comprueba con la
          # config ya resuelta de compose (FLYWAY_URL puede venir del .env o
          # de DB_URL/DB_NAME) en vez de suponerlo.
          FW_URL="$(./scripts/sso-stack.sh config flyway 2>/dev/null \
                    | sed -n 's/^ *FLYWAY_URL: *//p' | head -1 | tr -d "\"'\r")"
          [ -n "$FW_URL" ] || FW_URL="$(_envval FLYWAY_URL)"
          [ -n "$FW_URL" ] || FW_URL="jdbc:postgresql://$(_envval DB_URL)/$(_envval DB_NAME)"
          FW_HOSTPORT="${FW_URL#jdbc:postgresql://}"; FW_HOSTPORT="${FW_HOSTPORT%%/*}"
          FW_HOST="${FW_HOSTPORT%%:*}"
          FW_DB="${FW_URL#jdbc:postgresql://*/}"; FW_DB="${FW_DB%%\?*}"
          case "$FW_HOST" in
            postgres|sso-postgres) ;;
            *)
              echo "::error::flyway migra '$FW_HOST' (FLYWAY_URL), no el contenedor sso-postgres; la re-aplicación de migraciones editadas no sabe llegar ahí."
              exit 1 ;;
          esac
          PG_USER="$(_envval POSTGRES_USER)"; [ -n "$PG_USER" ] || PG_USER="$(_envval DB_USER)"
          [ -n "$FW_DB" ] || FW_DB="$(_envval DB_NAME)"
          for i in $(seq 1 60); do
            docker exec sso-postgres pg_isready -U "$PG_USER" -d "$FW_DB" >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { echo "::error::sso-postgres no responde"; exit 1; }
            sleep 2
          done

          echo "=== fase de migraciones (antes de recrear servicios) ==="
          echo "Re-aplicar por diff desde el último deploy: ${REAPPLY_CANDIDATES:-<ninguna>}"
          # -connectRetries explícito: `compose run flyway <args>` reemplaza
          # el command del servicio, y con él el -connectRetries=60.
          if ! MIGRATIONS_DIR=/opt/sso/postgres/migrations \
               FLYWAY_CMD="docker compose run --rm -T flyway -connectRetries=60" \
               PSQL_CMD="docker exec -i sso-postgres psql -U $PG_USER -d $FW_DB" \
               REAPPLY_CANDIDATES="$REAPPLY_CANDIDATES" \
               ./scripts/flyway-deploy.sh </dev/null; then
            echo "::error::falló la fase de migraciones; NO se recreó ningún servicio (siguen en la versión anterior)."
            dump_logs
            exit 1
          fi
          # Marca hasta qué commit están aplicadas las migraciones: el
          # próximo deploy re-aplica lo que cambió desde aquí (git diff),
          # sin depender del checksum de flyway, que un repair ya pisó.
          printf '%s\n' "$DEPLOY_SHA" > /opt/sso/.flyway-deployed-ref

          # ─── ¿Arranque en frío o redeploy en caliente? ───
          #
          # Si ninguno de los servicios gateados por flyway está corriendo,
          # el stack arranca desde cero: `up -d` completo (compose vuelve a
          # pasar por flyway por su depends_on, ahora un no-op).
          #
          # Si YA hay servicios gateados corriendo, se recrean con `--no-deps`
          # sólo los contenedores cuya imagen cambió, sin reevaluar su cadena
          # de dependencias (ya satisfecha: esos contenedores siguen arriba).
          RUNNING_SERVICES="$(docker compose ps --status running --services 2>/dev/null || true)"
          RUNNING_GATED=""
          for s in $GATED_SERVICES; do
            echo "$RUNNING_SERVICES" | grep -qx "$s" && RUNNING_GATED="${RUNNING_GATED:+$RUNNING_GATED }$s"
          done

          if [ -z "$RUNNING_GATED" ]; then
            echo "=== arranque en frío: ningún servicio gateado por flyway está corriendo ==="
            if ! up_stack; then
              echo "=== compose up falló ==="
              dump_logs
              exit 1
            fi
          else
            echo "=== redeploy en caliente: ya corriendo → $RUNNING_GATED ==="
            echo "=== migraciones ya aplicadas; se recrean sólo los servicios que cambiaron ==="
            # Los propios no gateados que no estén corriendo (servicio nuevo,
            # contenedor caído) se arrancan sin recrear los que ya corren; los
            # que cambiaron de imagen los recrea el --no-deps de abajo.
            APP_TO_START="$(filter_active $APP_SERVICES)"
            if [ -n "$APP_TO_START" ]; then
              ./scripts/sso-stack.sh up -d --no-recreate $APP_TO_START
            fi
            RECREATE="$(filter_active $CHANGED_SERVICES)"
            if [ -n "$RECREATE" ]; then
              echo "Recreando: $RECREATE"
              ./scripts/sso-stack.sh up -d --no-deps --remove-orphans $RECREATE
            else
              echo "Ningún servicio de aplicación cambió de imagen; nada que recrear."
            fi
          fi

          # Limpia capas de imágenes viejas para no llenar el disco
          # del Linode con cada deploy.
          docker image prune -f
          echo "=== deploy remoto completo ==="
          }
          deploy_remoto </dev/null
          EOF

          # El script remoto terminó entero: la marca es la del commit que
          # se despliega. Si algo lo cortara a medias sin fallar, aquí se ve.
          DEPLOYED_REF="$(ssh -i ~/.ssh/deploy_key "$DEST" 'cat /opt/sso/.flyway-deployed-ref 2>/dev/null || true' | tr -d '[:space:]')"
          if [ "$DEPLOYED_REF" != "$DEPLOY_SHA" ]; then
            echo "::error::La marca del servidor ('${DEPLOYED_REF:-<vacía>}') no es el commit desplegado ($DEPLOY_SHA): el script remoto no llegó al final."
            exit 1
          fi

      - name: ClickHouse migrations
        # Flyway (arriba) sólo migra sso-postgres. Los ALTER de
        # `auditoria.*` (ClickHouse) se venían aplicando A MANO por
        # ambiente -- V377 documentó ese ALTER como manual, se aplicó en
        # dev/test y se olvidó en producción: /audits/stats y
        # /audits/query devolvieron 500 ahí durante días sin que ningún
        # pipeline lo hubiera podido atrapar (ver postgres/migrations/V391
        # y docker/clickhouse/migrations/). Este paso corre
        # scripts/clickhouse-migrate.sh (mismo principio que Flyway:
        # versionar, trackear lo ya aplicado, fallar fuerte ante drift)
        # en cada deploy, a todo ambiente, así que un ALTER nuevo nunca
        # vuelve a quedar aplicado en dev/test y olvidado en producción.
        env:
          DEST: ${{ secrets.SSH_TARGET }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEST" \
            'cd /opt/sso && ./scripts/clickhouse-migrate.sh'

      - name: Smoke check (gateway health)
        env:
          DEST: ${{ secrets.SSH_TARGET }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEST" bash -s <<'EOF'
          set -euo pipefail
          # El gateway es el último en levantar (depende de auth-center
          # healthy); 5 min de margen cubre el arranque frío de las JVMs.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q UP; then
              echo "gateway UP"; exit 0
            fi
            sleep 10
          done
          echo "gateway no respondió UP en 5 min"
          cd /opt/sso && docker compose ps || true
          exit 1
          EOF
