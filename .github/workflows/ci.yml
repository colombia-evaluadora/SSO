# =============================================================================
# ci.yml — gate de integración sobre `dev`: matriz por módulo + admin-ui.
#
# Estructura de la matriz:
#   - common                       → mvn verify (compilación + unit tests)
#   - auth-center                  → mvn verify (compilación + integration
#                                    tests con Testcontainers — requiere Docker)
#   - sso-admin                    → idem
#   - api-gateway                  → idem (incluye Testcontainers también)
#   - admin-ui-{typecheck,test,lint,build}
#                                  → typecheck / vitest / eslint / vite build
#
# Dispara en:
#   - PR contra dev
#   - push directo a dev (concurrency cancela runs obsoletos)
#
# CI NO corre en `test` ni en `main` — esas ramas reciben merges ya
# verificados en `dev`, así que re-verificarlas duplica minutos sin
# añadir señal. Ver el comentario del bloque `on:` para más detalle.
#
# Notas:
#   - JDK 25 / Temurin (el repo está sobre Spring Boot 4 + JDK 25).
#   - `setup-java@v5` con `cache: maven` acelera cada job reutilizando
#     `.m2/repository` entre runs.
#   - Testcontainers funciona nativamente en runners Linux de GitHub
#     (Docker nativo). NO hace falta `TESTCONTAINERS_RYUK_DISABLED=true`
#     — esa trampa sólo la necesitaba el colima local del dev.
#   - Si el job toca admin-ui, hace checkout del repo entero y `cd admin-ui`
#     (no es submódulo, vive en la raíz del repo).
#
# Para activar branch protection, ir a Settings → Branches → Add rule
# sobre `dev` (script: `scripts/branch-protection.sh`) con
# required checks: `maven-common`, `maven-auth-center`,
# `maven-sso-admin`, `maven-api-gateway`, `flyway-migrations`,
# `admin-ui-typecheck`, `admin-ui-test`, `admin-ui-lint`, `admin-ui-build`.
# =============================================================================

name: CI

# CI corre SOLO en `dev`. Razones:
#   · `dev` es la rama de integración donde aterrizan las PRs de
#     feature/*. Aquí tiene sentido verificar cada cambio.
#   · `test` y `main` son promociones que vienen de merges ya
#     verificados en `dev` (mismo SHA, mismo contenido del squash).
#     Re-correr CI en cada promoción duplica minutos sin añadir
#     señal: si `dev` estaba en verde, `test` y `main` también lo
#     estarán.
#   · El plan Free del repo (cuando era privado) quemaba ~900 min/día
#     por este mismo error de diseño. Ahora es público y los minutos
#     son gratis, pero el motivo de fondo (no re-verificar lo ya
#     verificado) sigue aplicando.
#
# Si en algún momento quieres un gate extra en `main` (release),
# añade un workflow específico con `on: push: branches: [main]` y
# required checks más estrictos. No metas `main` aquí: este es el
# gate de integración.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# Permisos mínimos: checks:read para comentar / attach; contents:read
# para checkout. Los workflows no publican nada al registry en esta fase.
permissions:
  contents: read
  # Necesario desde que el repo es privado. En eventos `pull_request`,
  # dorny/paths-filter resuelve los ficheros cambiados por la API
  # (listFiles). Mientras el repo fue publico esa lectura no exigia scope
  # porque el dato era publico; al pasar a privado, sin `pull-requests: read`
  # el token responde "Resource not accessible by integration", el job
  # `changes` falla y TODOS los demas quedan en `skipping`, con lo que
  # `ci-ok` marca la PR en rojo sin haber compilado nada.
  pull-requests: read

concurrency:
  # Cancela runs obsoletos: si llega un push nuevo al mismo PR mientras
  # corre, mata el anterior para no gastar minutos del runner.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Forzar UTF-8 en JVM y shell para que mvn/tsc no rompan con caracteres
  # fuera de ASCII en logs de CI runners.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  # ───────── Qué cambió realmente ─────────
  #
  # Sin esto, tocar una línea de admin-ui compilaba los 8 módulos Java.
  # Con ~39 ejecuciones en un solo día eso fueron ~900 minutos: casi
  # media cuota mensual del plan Free.
  #
  # Los filtros NO son "una carpeta, un job". Respetan el grafo de
  # dependencias real del repo, y hay dos aristas que un filtro
  # ingenuo rompe:
  #
  #   · 7 de los 8 módulos dependen de `common` (todos menos
  #     eurekaserver), así que tocarlo obliga a recompilarlos.
  #   · api-gateway compila el SPA DENTRO de su Dockerfile (etapa
  #     node-spa), así que un cambio en admin-ui también le afecta.
  #     Parece independiente y no lo es.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      common:        ${{ steps.filter.outputs.common }}
      auth-center:   ${{ steps.filter.outputs.auth-center }}
      sso-admin:     ${{ steps.filter.outputs.sso-admin }}
      query-service: ${{ steps.filter.outputs.query-service }}
      file-service:  ${{ steps.filter.outputs.file-service }}
      reporting-service: ${{ steps.filter.outputs.reporting-service }}
      ai-control-service: ${{ steps.filter.outputs.ai-control-service }}
      api-gateway:   ${{ steps.filter.outputs.api-gateway }}
      cdc:           ${{ steps.filter.outputs.cdc }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      provisioner:   ${{ steps.filter.outputs.provisioner }}
      eurekaserver:  ${{ steps.filter.outputs.eurekaserver }}
      hello-service: ${{ steps.filter.outputs.hello-service }}
      admin-ui:      ${{ steps.filter.outputs.admin-ui }}
      migrations:    ${{ steps.filter.outputs.migrations }}
    steps:
      # fetch-depth: 2 (no el default de 1) es obligatorio para que
      # dorny/paths-filter pueda diffear en eventos `push`. En `pull_request`
      # el propio action resuelve el diff vía la API de GitHub y no necesita
      # historial local, pero en `push` hace `git diff` contra el commit
      # anterior (`before`) usando el checkout local — con fetch-depth: 1 ese
      # commit no está presente, el diff no se puede calcular, y el action
      # cae al fallback seguro de "todo cambió". Ese fallback silencioso era
      # justo lo que hacía que un push a `dev` (tras mergear una PR)
      # recompilara los 8 módulos aunque la PR sólo tocara uno: en PR
      # filtraba bien, en push corría todo. deploy-test.yml ya usa
      # fetch-depth: 2 en su propio job `changes` por este mismo motivo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # `common` actúa de disparador global: si cambia él, el pom
            # raíz o el propio workflow, se recompila todo.
            common: &global
              - 'common/**'
              - 'pom.xml'
              - '.github/workflows/ci.yml'
            auth-center:
              - *global
              - 'auth-center/**'
            sso-admin:
              - *global
              - 'sso-admin/**'
            query-service:
              - *global
              - 'query-service/**'
            file-service:
              - *global
              - 'file-service/**'
            reporting-service:
              - *global
              - 'reporting-service/**'
            ai-control-service:
              - *global
              - 'ai-control-service/**'
            # admin-ui entra aquí porque el Dockerfile del gateway lo
            # compila dentro.
            api-gateway:
              - *global
              - 'api-gateway/**'
              - 'admin-ui/**'
            cdc:
              - *global
              - 'cdc-sync/**'
            notification-service:
              - *global
              - 'notification-service/**'
            provisioner:
              - *global
              - 'provisioner/**'
            eurekaserver:
              # eurekaserver es el ÚNICO módulo que no depende de common,
              # así que no lleva el ancla *global: sólo lo despierta su
              # propia carpeta, el pom raíz o este workflow.
              - 'eurekaserver/**'
              - 'pom.xml'
              - '.github/workflows/ci.yml'
            hello-service:
              - *global
              - 'hello-service/**'
            admin-ui:
              - 'admin-ui/**'
              - '.github/workflows/ci.yml'
            migrations:
              - 'postgres/migrations/**'
              - '.github/scripts/check-flyway-migrations.sh'
              - 'scripts/flyway-deploy.sh'
              - 'scripts/migration-reapply-set.py'
              - 'scripts/migration-analysis/**'
              - '.github/workflows/ci.yml'

  # ───────── Migraciones: análisis estático (sin contenedores) ─────────
  #
  # Primero lo que se sabe leyendo el SQL, con el mismo grafo de dependencias
  # que docs/MAPA.md y deps.py; los jobs con Postgres van detrás y no gastan
  # minutos si esto ya falla:
  #   * orden: una migración del diff (nueva o EDITADA) que reescribe un
  #     objeto que una versión POSTERIOR redefine nace muerta en una base
  #     limpia y revierte lo posterior en un servidor (V29 en el PR #311).
  #     Antes solo lo miraba deploy-test, con el cambio ya en dev.
  #   * lint: invariantes del repo (gate, tildes en CODIGO, aridad, ...)
  #     sobre los ficheros del diff; el baseline deja fuera lo viejo.
  #   * plan de re-aplicación: editadas desde el release de partida de
  #     flyway-upgrade, expandidas con las posteriores que redefinen lo mismo
  #     (scripts/migration-reapply-set.py). flyway-upgrade usa ESTE cálculo en
  #     vez de rehacerlo, así que la simulación prueba exactamente el plan.
  migraciones-estatico:
    name: migraciones-estatico
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.migrations == 'true'
    outputs:
      base_1:    ${{ steps.plan.outputs.base_1 }}
      reapply_1: ${{ steps.plan.outputs.reapply_1 }}
      base_5:    ${{ steps.plan.outputs.base_5 }}
      reapply_5: ${{ steps.plan.outputs.reapply_5 }}
      # JSON con los tags_atras (1, 5) cuyo plan no está vacío.
      upgrade_matriz: ${{ steps.plan.outputs.upgrade_matriz }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Base del diff
        id: base
        # Por env y no interpolado en el script: el nombre de rama de un PR
        # lo elige quien lo abre.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "refs/heads/$PR_BASE" --no-tags
            BASE="$(git rev-parse FETCH_HEAD)"
          elif [ -n "$BEFORE" ] && git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null; then
            BASE="$BEFORE"
          else
            # Rama nueva (before = 000…) o force-push: el padre del commit.
            BASE="$(git rev-parse HEAD~1)"
          fi
          echo "Base: $BASE"
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"

      - name: Orden (migraciones que nacen pisadas por una posterior)
        run: python scripts/migration-analysis orden --base "${{ steps.base.outputs.ref }}"

      - name: Lint de invariantes sobre el diff
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git diff --name-only --diff-filter=AMR "${{ steps.base.outputs.ref }}...HEAD" \
                                 -- 'postgres/migrations/V*.sql')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "Sin migraciones en el diff."; exit 0
          fi
          python scripts/migration-analysis lint "${FILES[@]}"

      - name: Plan de re-aplicación desde los releases de partida
        id: plan
        run: |
          set -euo pipefail
          MATRIZ=""
          for n in 1 5; do
            BASE="$(git tag --list 'v*' --sort=-v:refname | sed -n "${n}p")"
            [ -n "$BASE" ] || BASE="$(git tag --list 'v*' --sort=-v:refname | tail -1)"
            # Solo las que ya existían en ese release (M/R): una nueva (A) no
            # está aplicada allí, la aplica migrate y no es una editada.
            # deploy.yml usa AMR porque el servidor descarta las no aplicadas.
            EDITADAS="$(git diff --name-only --diff-filter=MR "$BASE" HEAD -- 'postgres/migrations/V*.sql' \
                        | xargs -r -n1 basename | tr '\n' ' ')"
            PLAN=""
            if [ -n "${EDITADAS// /}" ]; then
              # shellcheck disable=SC2086  # lista de basenames, a propósito
              PLAN="$(python scripts/migration-reapply-set.py $EDITADAS | tr '\n' ' ')"
            fi
            echo "base_$n=$BASE" >> "$GITHUB_OUTPUT"
            echo "reapply_$n=$PLAN" >> "$GITHUB_OUTPUT"
            {
              echo "### Re-aplicación desde \`$BASE\`"
              echo "- Editadas: ${EDITADAS:-ninguna}"
              echo "- Plan (con las posteriores que redefinen lo mismo): ${PLAN:-ninguno}"
            } >> "$GITHUB_STEP_SUMMARY"
            # flyway-upgrade solo simula los puntos de partida con algo que
            # re-aplicar; sin editadas, flyway-migrations ya cubre el caso.
            if [ -n "${PLAN// /}" ]; then MATRIZ="${MATRIZ:+$MATRIZ,}$n"; fi
          done
          echo "upgrade_matriz=[${MATRIZ}]" >> "$GITHUB_OUTPUT"
          echo "flyway-upgrade correrá desde: [${MATRIZ}]"

  # ───────── Migraciones Flyway: choque de versión + idempotencia ─────────
  #
  # Sin esto, dos ramas podían crear cada una un V<n> distinto con el mismo
  # número (ej. las dos usan V125 porque cada una lo calculó contra su propio
  # `dev` local) y el choque sólo se descubría al hacer merge — o peor, en
  # el deploy, con flyway ya corriendo contra el servidor real. También
  # faltaba cualquier señal de que una migración nueva no fuera idempotente,
  # lo cual importa porque el flujo de recuperación de deploy-test.yml
  # (`flyway repair` + `migrate -outOfOrder=true`) puede reaplicar
  # migraciones recientes.
  #
  # Corre contra un Postgres 16 efímero (mismo major que el `flyway/flyway`
  # de producción) usando el historial COMPLETO de postgres/migrations, no
  # sólo las nuevas: si una migración vieja ya no aplica limpia sobre un
  # esquema nuevo, mejor enterarse en CI que en un deploy.
  flyway-migrations:
    name: flyway-migrations
    runs-on: ubuntu-latest
    needs: [changes, migraciones-estatico]
    if: needs.changes.outputs.migrations == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flyway_ci
          POSTGRES_PASSWORD: flyway_ci
          POSTGRES_DB: flyway_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flyway_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # fetch-depth: 0 (historial completo): el chequeo de colisión de
      # versión necesita poder listar el árbol de la rama destino con
      # `git ls-tree`, y eso exige tener sus commits disponibles localmente.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar rama/commit destino para el diff
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}" --no-tags
            echo "ref=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          else
            # push a dev: comparar contra el tip previo del propio push.
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar historial completo de migraciones (flyway migrate)
        # `docker run` directo (no `uses: docker://…`): esa forma sólo
        # funciona bien cuando la imagen trae su propio action.yml, que la
        # de flyway/flyway no tiene. `--network host` es la forma más simple
        # de que el contenedor vea el Postgres del `services:` del job (que
        # el runner publica en localhost:5432).
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/postgres/migrations:/flyway/sql:ro" \
            flyway/flyway:11-alpine \
            -url=jdbc:postgresql://localhost:5432/flyway_ci \
            -user=flyway_ci \
            -password=flyway_ci \
            -connectRetries=10 \
            migrate

      - name: Instalar cliente psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Colisión de versión + idempotencia
        run: |
          chmod +x .github/scripts/check-flyway-migrations.sh
          .github/scripts/check-flyway-migrations.sh \
            "${{ steps.target.outputs.ref }}" \
            localhost 5432 flyway_ci flyway_ci flyway_ci

  # ───────── Migraciones: subida desde el último release ─────────
  #
  # Reproduce lo que hace el deploy sobre un servidor real, no sobre una base
  # vacía: base en el estado del último tag v*, `flyway repair` con los
  # ficheros nuevos (como quedó producción tras v1.1.57: el checksum ya no
  # delata las migraciones editadas) y luego scripts/flyway-deploy.sh, el
  # mismo que corre deploy.yml. Atrapa una editada que no es re-ejecutable
  # sobre su versión vieja, o una pendiente que necesita lo que la edición
  # añadió (V540 -> fn_grado_escala_aplicable de V428). Al final compara el
  # esquema con una base limpia migrada desde HEAD: re-aplicar en otro orden
  # dejaría las mismas funciones con otro cuerpo, sin un solo error.
  #
  # Dos puntos de partida: el último tag (el deploy normal) y el quinto más
  # reciente (un servidor que se saltó releases fallidos, como producción
  # entre v1.1.55 y v1.1.58, con más migraciones editadas por medio).
  flyway-upgrade:
    name: flyway-upgrade (tag -${{ matrix.tags_atras }})
    runs-on: ubuntu-latest
    needs: [changes, migraciones-estatico]
    # Sin migraciones editadas desde ningún release de partida no hay subida
    # que simular: el job queda skipped (ci-ok lo acepta).
    if: >-
      needs.changes.outputs.migrations == 'true'
      && needs.migraciones-estatico.outputs.upgrade_matriz != '[]'
    strategy:
      fail-fast: false
      matrix:
        tags_atras: ${{ fromJSON(needs.migraciones-estatico.outputs.upgrade_matriz) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flyway_ci
          POSTGRES_PASSWORD: flyway_ci
          POSTGRES_DB: flyway_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flyway_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: flyway_ci
      PGPASSWORD: flyway_ci
      FW: >-
        docker run --rm --network host
        -v ${{ github.workspace }}/postgres/migrations:/flyway/sql:ro
        flyway/flyway:11-alpine -user=flyway_ci -password=flyway_ci -connectRetries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar cliente psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Base en el estado de un release anterior
        id: base
        run: |
          set -euo pipefail
          # El mismo release de partida que usó el plan de migraciones-estatico.
          BASE="${{ needs.migraciones-estatico.outputs[format('base_{0}', matrix.tags_atras)] }}"
          echo "Release de partida: $BASE"
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/base
          git archive "$BASE" postgres/migrations | tar -x -C /tmp/base
          docker run --rm --network host -v /tmp/base/postgres/migrations:/flyway/sql:ro \
            flyway/flyway:11-alpine -url=jdbc:postgresql://localhost:5432/flyway_ci \
            -user=flyway_ci -password=flyway_ci -connectRetries=10 migrate
          $FW -url=jdbc:postgresql://localhost:5432/flyway_ci repair

      - name: Fase de migraciones del deploy (scripts/flyway-deploy.sh)
        env:
          # El plan de migraciones-estatico, no un cálculo propio: la
          # simulación prueba exactamente lo que el análisis decidió.
          REAPPLY_CANDIDATES: ${{ needs.migraciones-estatico.outputs[format('reapply_{0}', matrix.tags_atras)] }}
        run: |
          set -euo pipefail
          echo "Plan de re-aplicación (migraciones-estatico): ${REAPPLY_CANDIDATES:-<ninguno>}"
          export MIGRATIONS_DIR="$PWD/postgres/migrations"
          export FLYWAY_CMD="$FW -url=jdbc:postgresql://localhost:5432/flyway_ci"
          export PSQL_CMD="psql -d flyway_ci"
          bash scripts/flyway-deploy.sh

      - name: Mismo esquema que una base limpia
        run: |
          set -euo pipefail
          psql -d flyway_ci -c 'CREATE DATABASE limpia'
          $FW -url=jdbc:postgresql://localhost:5432/limpia migrate > /dev/null
          snapshot() {
            psql -d "$1" -AtX <<'SQL'
          SELECT 'fn '||n.nspname||'.'||p.proname||'('||pg_get_function_identity_arguments(p.oid)||') '||md5(pg_get_functiondef(p.oid))
            FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
           WHERE n.nspname NOT IN ('pg_catalog','information_schema') AND n.nspname NOT LIKE 'pg\_%' AND p.prokind IN ('f','p');
          SELECT 'view '||schemaname||'.'||viewname||' '||md5(definition)
            FROM pg_views WHERE schemaname NOT IN ('pg_catalog','information_schema');
          SELECT 'col '||table_schema||'.'||table_name||'.'||column_name||' '||data_type
            FROM information_schema.columns WHERE table_schema NOT IN ('pg_catalog','information_schema');
          SELECT 'query '||coalesce(type,'')||' '||http_method||' '||coalesce(path_template,'')||' '||md5(query)||' '||param_types::text
            FROM public.query;
          SQL
          }
          snapshot flyway_ci | sort > /tmp/subida.txt
          snapshot limpia    | sort > /tmp/limpia.txt
          # Lo que está en la limpia y falta (o difiere) en la subida. Lo que
          # sobra en la subida (objetos de migraciones borradas) no cuenta.
          FALTA="$(comm -13 /tmp/subida.txt /tmp/limpia.txt)"
          if [ -n "$FALTA" ]; then
            echo "::error::La subida desde ${{ steps.base.outputs.ref }} no deja el mismo esquema que una base limpia:"
            printf '%s\n' "$FALTA" | head -50
            exit 1
          fi
          echo "Esquema idéntico a una base limpia ($(wc -l < /tmp/limpia.txt) objetos comparados)."

  # ───────── Backend: common (compilación + unit tests) ─────────
  maven-common:
    if: needs.changes.outputs.common == 'true'
    needs: [changes]
    name: maven-common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (common)
        run: mvn -B -ntp -pl common -am verify -DskipITs=false

  # ───────── Backend: auth-center (Testcontainers) ─────────
  maven-auth-center:
    name: maven-auth-center
    runs-on: ubuntu-latest
    # `needs` e `if` van juntos a propósito. Si maven-common se SALTA
    # (porque common no cambió), GitHub saltaría en cascada todo lo
    # que dependa de él. Por eso se comprueba `!= failure` y no
    # `== success`: saltado es un resultado válido, fallido no.
    needs: [changes, maven-common]
    if: >-
      !cancelled()
      && needs.changes.outputs.auth-center == 'true'
      && needs.maven-common.result != 'failure'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (auth-center)
        run: mvn -B -ntp -pl auth-center -am verify

  # ───────── Backend: sso-admin (Testcontainers) ─────────
  maven-sso-admin:
    name: maven-sso-admin
    runs-on: ubuntu-latest
    needs: [changes, maven-common]
    if: >-
      !cancelled()
      && needs.changes.outputs.sso-admin == 'true'
      && needs.maven-common.result != 'failure'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (sso-admin)
        run: mvn -B -ntp -pl sso-admin -am verify

  # ───────── Backend: query-service ─────────
  # Añadido tras un incidente: query-service NO estaba en CI, así
  # que su primera compilación ocurría en el paso build-push del
  # workflow de deploy. Seis errores de compilación (métodos
  # duplicados, imports ausentes, firmas de Micrometer/Resilience4j
  # equivocadas, captura de local en lambda) llegaron a `test` con
  # CI en verde y sólo reventaron al construir la imagen — cuatro
  # ciclos de deploy quemados para descubrirlos de uno en uno.
  #
  # eurekaserver, hello-service, notification-service y provisioner
  # arrastraron el mismo agujero hasta que se les dio job propio más
  # abajo. Hoy los 12 servicios que publica deploy-test.yml pasan por
  # CI: ninguna imagen se construye por primera vez en el deploy.
  maven-query-service:
    name: maven-query-service
    runs-on: ubuntu-latest
    needs: [changes, maven-common]
    if: >-
      !cancelled()
      && needs.changes.outputs.query-service == 'true'
      && needs.maven-common.result != 'failure'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (query-service)
        run: mvn -B -ntp -pl query-service -am verify

  # ───────── Backend: file-service ─────────
  # Entra en CI desde el primer commit, en vez de repetir el agujero
  # de query-service: su primera compilación no puede ser el
  # build-push del deploy.
  maven-file-service:
    name: maven-file-service
    runs-on: ubuntu-latest
    needs: [changes, maven-common]
    if: >-
      !cancelled()
      && needs.changes.outputs.file-service == 'true'
      && needs.maven-common.result != 'failure'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (file-service)
        run: mvn -B -ntp -pl file-service -am verify

  # ───────── Backend: reporting-service ─────────
  # Los tests de render (RenderersTest) compilan y llenan un reporte
  # Jasper de verdad, asi que necesitan AWT en modo headless: sin eso
  # el runner sin display falla al medir el texto.
  maven-reporting-service:
    name: maven-reporting-service
    runs-on: ubuntu-latest
    needs: [changes, maven-common]
    if: >-
      !cancelled()
      && needs.changes.outputs.reporting-service == 'true'
      && needs.maven-common.result != 'failure'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (reporting-service)
        run: mvn -B -ntp -pl reporting-service -am verify -Djava.awt.headless=true

  # ───────── Backend: ai-control-service ─────────
  # Los tests no llaman al proveedor real: un HttpServer local hace de
  # NVIDIA y de query-service, asi que no necesitan ningun secreto.
  maven-ai-control-service:
    name: maven-ai-control-service
    runs-on: ubuntu-latest
    needs: [changes, maven-common]
    if: >-
      !cancelled()
      && needs.changes.outputs.ai-control-service == 'true'
      && needs.maven-common.result != 'failure'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (ai-control-service)
        run: mvn -B -ntp -pl ai-control-service -am verify

  # ───────── Backend: cdc-sync (reactor independiente) ─────────
  # cdc-sync NO es un módulo del pom raíz: tiene su propio parent
  # (cdc-sync-parent) con cdc-common, cdc-generator, cdc-capture y
  # cdc-worker. Por eso necesita -f en vez de -pl.
  #
  # `verify` aquí compila main + test y corre los tests unitarios
  # (surefire coge *Test.java). Las clases *IT.java —que levantan
  # Testcontainers— se COMPILAN pero no se ejecutan, porque no hay
  # plugin failsafe configurado en estos poms. Eso es justo lo que
  # queremos de una gate de CI: detecta errores de compilación y
  # regresiones unitarias en segundos, sin arrastrar contenedores
  # ni la flakiness de un E2E. Si algún día se quiere correr las
  # ITs, añadir failsafe al pom y un job aparte (nightly), no aquí.
  maven-cdc:
    name: maven-cdc
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.cdc == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # column-types.json es un recurso GENERADO, no versionado
      # (.gitignore: **/column-types.json). cdc-worker/Dockerfile lo
      # regenera desde V22 con cdc-generator antes de empaquetar.
      # ColumnTypeRegistryTest lo carga del classpath, así que sin
      # este paso esos tests fallan con "Resource not found on
      # classpath: column-types.json" — no por una regresión, sino
      # porque el artefacto sólo existía dentro del build de Docker.
      # Reproducimos aquí los mismos dos pasos del Dockerfile.
      - name: Generate column-types.json from V22
        run: |
          mvn -B -ntp -f cdc-sync/pom.xml -pl cdc-generator -am package -DskipTests -q
          java -jar cdc-sync/cdc-generator/target/app.jar \
            --source postgres/migrations/V22__academic-schema.sql \
            --out cdc-sync/cdc-common/src/main/resources/column-types.json
      - name: Verify (cdc-sync)
        run: mvn -B -ntp -f cdc-sync/pom.xml verify

  # ───────── Backend: notification-service ─────────
  # Entra en CI por el mismo motivo que query-service en su día: es el
  # segundo módulo más grande del repo (43 archivos), se despliega en
  # cada release y su primera compilación era el build-push del deploy.
  maven-notification-service:
    name: maven-notification-service
    runs-on: ubuntu-latest
    needs: [changes, maven-common]
    if: >-
      !cancelled()
      && needs.changes.outputs.notification-service == 'true'
      && needs.maven-common.result != 'failure'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # NotificationServiceIntegrationTest queda excluido, y no por
      # comodidad: al meter este módulo en CI por primera vez, sus 5
      # tests de integración salieron en rojo. NO es falta de
      # infraestructura —los Testcontainers de Postgres y RabbitMQ
      # levantan bien, el job tarda 64s en ellos— sino que la
      # notificación nunca llega a procesarse y el awaitility expira
      # esperando la fila de notification_log. Es un fallo real que
      # llevaba oculto justo porque el módulo no estaba en CI.
      #
      # Se excluye para que el gate cubra ya lo que importa —que el
      # módulo COMPILE, que era el agujero que costó cuatro ciclos de
      # deploy con query-service— sin bloquear a todo el mundo con una
      # rotura preexistente. Los 9 tests unitarios (ProviderSelectorTest,
      # NotificationProcessorTest) sí corren.
      #
      # Mismo criterio que cdc-sync más arriba: compilar siempre,
      # ejecutar la integración cuando tenga quien la mantenga.
      # Arreglar estos 5 y quitar la exclusión es trabajo aparte.
      - name: Verify (notification-service)
        run: >-
          mvn -B -ntp -pl notification-service -am verify
          -Dtest='!NotificationServiceIntegrationTest'
          -Dsurefire.failIfNoSpecifiedTests=false

  # ───────── Backend: provisioner ─────────
  maven-provisioner:
    name: maven-provisioner
    runs-on: ubuntu-latest
    needs: [changes, maven-common]
    if: >-
      !cancelled()
      && needs.changes.outputs.provisioner == 'true'
      && needs.maven-common.result != 'failure'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (provisioner)
        run: mvn -B -ntp -pl provisioner -am verify

  # ───────── Backend: eurekaserver ─────────
  # No lleva `needs: maven-common` porque es el único módulo que no
  # depende de common — encadenarlo sólo serializaría el pipeline.
  maven-eurekaserver:
    name: maven-eurekaserver
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.eurekaserver == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (eurekaserver)
        run: mvn -B -ntp -pl eurekaserver -am verify

  # ───────── Backend: hello-service ─────────
  maven-hello-service:
    name: maven-hello-service
    runs-on: ubuntu-latest
    needs: [changes, maven-common]
    if: >-
      !cancelled()
      && needs.changes.outputs.hello-service == 'true'
      && needs.maven-common.result != 'failure'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (hello-service)
        run: mvn -B -ntp -pl hello-service -am verify

  # ───────── Backend: api-gateway (Testcontainers) ─────────
  maven-api-gateway:
    name: maven-api-gateway
    runs-on: ubuntu-latest
    needs: [changes, maven-common, maven-auth-center, maven-sso-admin]
    if: >-
      !cancelled()
      && needs.changes.outputs.api-gateway == 'true'
      && needs.maven-common.result != 'failure'
      && needs.maven-auth-center.result != 'failure'
      && needs.maven-sso-admin.result != 'failure'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (api-gateway)
        run: mvn -B -ntp -pl api-gateway -am verify
      - name: Build api-gateway jar (for SPA bake-in smoke)
        run: mvn -B -ntp -pl api-gateway -am package -DskipTests
      - name: Upload api-gateway jar
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: api-gateway/target/*.jar
          retention-days: 7
        # Same rationale as the admin-ui-build upload:
        # the build (Verify step above) is what gates a PR.
        # The upload is a side effect consumed by
        # deploy-test.yml on push-to-test. A storage-quota
        # outage in the GitHub org must NOT block the gate.
        # (PR #10 added the same for admin-ui-build on
        # 2026-08-07; mirroring here for consistency.)
        continue-on-error: true

  # ───────── Frontend: typecheck ─────────
  admin-ui-typecheck:
    name: admin-ui-typecheck
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.admin-ui == 'true'
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run build -- --mode=typecheck-only || npx tsc -b --noEmit

  # ───────── Frontend: tests unitarios ─────────
  admin-ui-test:
    name: admin-ui-test
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.admin-ui == 'true'
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Vitest (single run, no watch)
        run: npm test -- --run

  # ───────── Frontend: ESLint ─────────
  admin-ui-lint:
    name: admin-ui-lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.admin-ui == 'true'
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint

  # ───────── Frontend: build de producción (artefacto) ─────────
  admin-ui-build:
    name: admin-ui-build
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.admin-ui == 'true'
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-dist
          path: admin-ui/dist
          retention-days: 7
        # The build itself is what gates a PR (does the
        # production bundle compile?). The upload is a
        # side effect that lets deploy-test.yml pick the
        # bundle up on push-to-test. A storage-quota
        # exhaustion in the GitHub org must NOT block
        # the PR gate — the deploy will simply skip the
        # artifact and rebuild locally instead.
        # (Hit on 2026-08-07: "Artifact storage quota has
        # been hit. Unable to upload any new artifacts.")
        continue-on-error: true

  # ───────── Puerta única ─────────
  #
  # Con jobs condicionales, los que no aplican salen como `skipped`.
  # Un required check que se salta NO se marca como cumplido y
  # bloquearía el merge para siempre. Este job agrega el resultado de
  # todos y es el único que conviene marcar como requerido.
  #
  # `always()` es imprescindible: sin él, este job también se saltaría
  # en cascada cuando se salten sus dependencias, que es justo el caso
  # normal.
  #
  # Nota: hoy la protección de ramas no está disponible en el plan Free
  # para repos privados, así que no hay required checks que configurar.
  # Queda listo para cuando lo esté.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - migraciones-estatico
      - flyway-migrations
      - flyway-upgrade
      - maven-common
      - maven-auth-center
      - maven-sso-admin
      - maven-query-service
      - maven-file-service
      - maven-ai-control-service
      - maven-api-gateway
      - maven-cdc
      - maven-notification-service
      - maven-provisioner
      - maven-eurekaserver
      - maven-hello-service
      - admin-ui-typecheck
      - admin-ui-test
      - admin-ui-lint
      - admin-ui-build
    steps:
      - name: Fallar si algún job requerido falló o fue cancelado
        run: |
          # Antes se hacía `join(needs.*.result, " ")` — falla en la
          # validación previa del workflow porque las comillas DOBLES
          # son string literals inválidos para el lexer de GitHub
          # Actions (sólo acepta simples). Resultado: el workflow se
          # parsea, ningún job se instancia, total_count=0 en la API.
          #
          # Aquí se enumera cada job uno a uno. Más largo, pero no
          # depende de `join` ni de `toJSON`, y cada `needs.X.result`
          # es una expresión trivial.
          for r in \
            '${{ needs.changes.result }}' \
            '${{ needs.migraciones-estatico.result }}' \
            '${{ needs.flyway-migrations.result }}' \
            '${{ needs.flyway-upgrade.result }}' \
            '${{ needs.maven-common.result }}' \
            '${{ needs.maven-auth-center.result }}' \
            '${{ needs.maven-sso-admin.result }}' \
            '${{ needs.maven-query-service.result }}' \
            '${{ needs.maven-file-service.result }}' \
            '${{ needs.maven-ai-control-service.result }}' \
            '${{ needs.maven-api-gateway.result }}' \
            '${{ needs.maven-cdc.result }}' \
            '${{ needs.maven-notification-service.result }}' \
            '${{ needs.maven-provisioner.result }}' \
            '${{ needs.maven-eurekaserver.result }}' \
            '${{ needs.maven-hello-service.result }}' \
            '${{ needs.admin-ui-typecheck.result }}' \
            '${{ needs.admin-ui-test.result }}' \
            '${{ needs.admin-ui-lint.result }}' \
            '${{ needs.admin-ui-build.result }}'; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Al menos un job terminó en '$r'."
              exit 1
            fi
          done
          echo "Todos los jobs aplicables pasaron (los saltados no aplicaban)."
