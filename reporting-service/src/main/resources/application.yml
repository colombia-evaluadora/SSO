server:
  # 8087 — los ocupados: 8080 gateway, 8081 auth-center, 8082 hello,
  # 8083 sso-admin, 8084 query-service, 8085 notification, 8086 file.
  port: ${PORT:8087}
  shutdown: graceful
  error:
    # Sin esto el `reason` de un ResponseStatusException NO viaja al cliente:
    # el cuerpo sale con timestamp/status/error/path y nada mas, y diagnosticar
    # un 400 obliga a entrar al servidor a leer logs. Lo que se propaga es
    # deliberado (ver QueryServiceClient): en 4xx el mensaje del query-service,
    # que ya viene saneado; en 5xx uno generico.
    include-message: always

spring:
  application:
    name: reporting-service
  main:
    banner-mode: off

  # Este servicio no tiene base de datos: los datos llegan por HTTP
  # desde el query-service. Sin estas exclusiones el autoconfig de Boot
  # arma un DataSource fantasma y el arranque muere con "Failed to
  # determine a suitable driver class". Son los mismos nombres (ya
  # movidos a los modulos de Boot 4) que excluye query-service.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

  # Un reporte sin paginar viaja completo en una respuesta JSON desde el
  # query-service. Los defaults de Jackson cortan cadenas largas mucho
  # antes de eso.
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    parser:
      max-string-length: 20971520

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: false
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

reporting:
  # Directo al query-service del catalogo eval-col, no al gateway: ya
  # estamos dentro de la red y dar la vuelta solo suma un salto.
  #
  # Es la base POR DEFECTO, no la unica: cada microservicio registrado
  # tiene su propia instancia de query-service, y un reporte puede fijar
  # la suya con `base-url` (ver los reportes de Auditoria mas abajo).
  query-service-base-url: ${REPORTING_QUERY_SERVICE_URL:http://query-service-eval-col:8084}

  # La instancia de Auditoria (microservicio audit-clickhouse-cval) se
  # declara reporte por reporte en `base-url`, con la variable
  # REPORTING_AUDIT_CVAL_URL. Habla ClickHouse y NO tiene conexion a
  # Postgres: es un backend distinto, no una ruta mas del de arriba. El
  # nombre del contenedor lo fija el provisioner como "query-service-" +
  # instancename (MicroserviceController.containerName).

  # Tope duro. V66 quito el LIMIT de las funciones, asi que este es el
  # unico freno que queda entre un filtro mal puesto y un PDF de
  # cientos de miles de filas.
  max-rows: ${REPORTING_MAX_ROWS:50000}

  # Un reporte completo tarda mucho mas que una pagina de 10 filas.
  request-timeout: ${REPORTING_REQUEST_TIMEOUT:3m}

  # De donde se bajan las imagenes que van DENTRO de un reporte (el fondo del
  # boletin, la foto del estudiante, las evidencias). Directo al servicio y no
  # al gateway, por el mismo criterio que query-service-base-url.
  file-service-base-url: ${REPORTING_FILE_SERVICE_URL:http://file-service:8086}

  # Secreto compartido con file-service (files.internal-token). Se usa
  # X-Internal-Token y NO el JWT del usuario a proposito: FileAccessService
  # solo reconoce como propias las fotos de perfil y los soportes, asi que con
  # el token del usuario la foto de matricula y el fondo darian 404 y el
  # boletin saldria mudo. La autorizacion ya ocurrio una capa antes -- la
  # funcion PL/pgSQL aplico el gate con alcance y solo devolvio los
  # estudiantes que ese usuario alcanza. Vacio = el reporte sale sin imagenes.
  file-internal-token: ${REPORTING_FILE_INTERNAL_TOKEN:}

  # Mucho menor que el de una consulta: una foto que tarda medio minuto es una
  # foto que no vamos a esperar.
  file-request-timeout: ${REPORTING_FILE_REQUEST_TIMEOUT:20s}

  # Tope POR IMAGEN. El PDF se exporta entero en memoria, asi que una imagen
  # desmedida multiplicada por las paginas de un grupo es un OOM. Al superarlo
  # se omite esa imagen, no el reporte.
  max-image-bytes: ${REPORTING_MAX_IMAGE_BYTES:4194304}

  # ---------------------------------------------------------------
  # Catalogo de reportes. `path` es el path_template de la fila
  # public.query creada en V67 — la que llama a fn_X_listar con las
  # paginas en NULL.
  #
  # `columns` fija QUE columnas salen y en que orden. Se declaran a
  # proposito en vez de volcar todo lo que devuelve la funcion: las
  # columnas fk_* y pk_* son llaves internas que no significan nada
  # para quien lee el reporte. Ademas, el orden de las claves de un
  # objeto JSON no esta garantizado, asi que sin esta lista el orden de
  # las columnas podria cambiar entre ejecuciones.
  #
  # Agregar un reporte = una fila query (migracion) + una entrada aca.
  # Si ademas se quiere diseno propio, un reportes/<clave>.jrxml.
  # ---------------------------------------------------------------
  reports:
    funcionarios:
      path: /establecimientos/funcionarios/reporte
      title: Funcionarios
      file-name: funcionarios
      columns:
        numero_documento: Documento
        nombre_completo: Nombre completo
        estado_label: Estado
        jornada_nombre: Jornada
        roles: Roles
        sedes: Sedes

    establecimientos:
      path: /establecimientos/reporte
      title: Establecimientos educativos
      file-name: establecimientos
      columns:
        codigo: Codigo
        nombre: Nombre
        nit: NIT
        departamento_nombre: Departamento
        municipio_nombre: Municipio
        estado_nombre: Estado

    periodos-academicos:
      path: /periodos-academicos/reporte
      title: Periodos academicos
      file-name: periodos-academicos
      columns:
        name: Periodo
        school_year_name: Año
        sede_name: Sede
        jornada_name: Jornada
        start_date: Inicio
        end_date: Fin
        enrollment_deadline: Limite matricula
        status_name: Estado

    periodos-evaluacion:
      path: /periodo-evaluacion/reporte
      title: Periodos de evaluacion
      file-name: periodos-evaluacion
      columns:
        codigo: Codigo
        nombre: Nombre
        abreviacion: Abreviacion
        start_date: Inicio
        end_date: Fin
        peso: Peso
        estado_name: Estado
        sede_name: Sede

    plan-estudio:
      path: /plan-estudio/reporte
      title: Plan de estudio
      file-name: plan-estudio
      columns:
        grado_name: Grado
        asignatura: Asignatura
        abreviacion: Abreviacion
        especialidad_name: Especialidad
        intensidad_horaria: Intensidad horaria
        influencia_area: Influencia area
        matricula_obligatoria: Matricula obligatoria
        aprobacion_obligatoria: Aprobacion obligatoria
        influye_desempeno: Influye desempeno

    grados:
      path: /grados/reporte
      title: Grados y grupos
      file-name: grados-grupos
      columns:
        grado_name: Grado
        grado_codigo: Numero de grado
        teaching_level_name: Nivel de ensenanza
        grupo_name: Grupo
        jornada_name: Jornada
        director_name: Director de grupo
        plan_estudio_name: Plan de estudio

    areas:
      path: /areas/reporte
      title: Areas, asignaturas y especialidades
      file-name: areas-asignaturas
      columns:
        area_general_name: Area general
        area_nombre_interno: Nombre interno del area
        area_abreviacion: Abreviacion del area
        asignatura: Asignatura
        asignatura_abreviacion: Abreviacion asignatura
        especialidad_name: Especialidad
        orden_reportes: Orden en reportes
        color: Color

    escalas:
      path: /escalas/reporte
      title: Escalas de valoracion
      file-name: escalas-valoracion
      columns:
        teaching_level_name: Nivel de ensenanza
        nombre: Nombre del desempeno
        abreviacion: Abreviacion
        nota_maxima: Nota maxima
        nota_minima: Nota minima
        nota_equivalente: Nota equivalente
        tipo_name: Tipo de evaluacion
        iconografia: Iconografia

    asignaciones:
      path: /asignaciones/reporte
      title: Asignacion academica
      file-name: asignacion-academica
      columns:
        docente_nombre: Nombre del docente
        document_number: Documento
        estado: Estado
        asignatura: Asignatura
        grado_name: Grado
        grupo_name: Grupo
        jornada_name: Jornada

    sedes:
      path: /establecimientos/sedes/reporte
      title: Sedes educativas
      file-name: sedes
      columns:
        codigo: Codigo
        nombre: Nombre
        consecutivo: Consecutivo
        zona_nombre: Zona
        direccion: Direccion
        telefono: Telefono

    # Reporte de Matricula. `columns` es el CATALOGO completo exportable --
    # el front manda `columns` en el body con las que tenga visibles en su
    # tabla en ese momento (ver ColumnLayout.resolver), y esta lista es el
    # whitelist contra el que se filtra: una clave que el front mande y no
    # este aca se ignora, nunca se agrega una columna nueva por ese camino.
    # Claves = las mismas que devuelve fn_matricula_listar (V200/V270).
    matricula:
      path: /matricula/reporte
      title: Matricula
      file-name: matricula
      columns:
        document_number: Documento
        first_name: Nombres
        last_name: Apellidos
        institution: Institucion
        campus: Sede
        shift: Jornada
        education_level: Nivel de ensenanza
        grade: Grado
        grupo: Grupo
        enrollment_date: Fecha de matricula
        guardian: Acudiente
        status: Estado
        has_grades: Tiene calificaciones

    # E03HU57 -- Reporte de asistencia por grupo. path = fila 'asis-reporte-grupo'
    # (V281): fn_asistencia_listar_seguimiento sin paginar, con GRUPO y el
    # rango de fechas obligatorios. asignatura/actividad quedan como dos
    # columnas separadas (nunca las dos llenas a la vez -- CK_TASISTENCIA_CONTEXTO
    # exige asignatura o actividad, nunca ambas): en preescolar/formativo la
    # fila trae actividad y asignatura vacia, y viceversa en el resto de grupos.
    asistencia:
      path: /asistencias/reporte
      title: Asistencia por grupo
      file-name: asistencia-grupo
      columns:
        estudiante: Estudiante
        documento: Documento
        grupo: Grupo
        asignatura: Asignatura
        actividad: Actividad
        fecha: Fecha
        tipo_asistencia: Estado
        observacion: Observacion
        soporte_nombre: Soporte

    # Planeador -- actividades. path = fila V404 (fn_actividad_listar sin
    # paginar, mismos filtros y alcance que GET /planeador/actividades). El
    # front manda en `filters` el mismo objeto del listado (SEARCH, ASIGNATURA,
    # GRUPO, UNIDAD, TIPO_ACTIVIDAD, INSTRUMENTO, FECHA_DESDE, FECHA_HASTA,
    # ESTADOS, DIAS_GRACIA, INCLUIR_INACTIVAS, DIA, FUNCIONARIO) + IDS para
    # "exportar seleccionados". `columns` es el whitelist: las de la tabla del
    # planeador, sin pk_*/fk_* ni las de navegacion por dia.
    planeador-actividades:
      path: /planeador/actividades/export-all
      title: Actividades del planeador
      file-name: planeador-actividades
      columns:
        titulo: Actividad
        unidad: Unidad tematica
        asignatura: Asignatura
        area: Area
        grado_grupo: Grado / grupo
        tipo_actividad: Tipo
        instrumento_evaluacion: Instrumento
        fecha_inicio: Inicio
        fecha_cierre: Cierre
        estado: Estado
        ponderacion: Ponderacion
        estudiantes_asignados: Asignados
        estudiantes_evaluados: Evaluados
        porcentaje_evaluado: '% evaluado'

    # Planeador -- unidades tematicas (la otra pestana de la pantalla).
    # path = fila V406 (fn_unidad_listar sin paginar). Los textos de los
    # objetivos y contenidos NO salen: la funcion solo devuelve cuantos
    # hay, y sacarlos seria un reporte maestro-detalle distinto.
    planeador-unidades:
      path: /planeador/unidades/export-all
      title: Unidades tematicas
      file-name: planeador-unidades
      columns:
        nombre: Unidad
        descripcion: Descripcion
        asignatura: Asignatura
        area: Area
        grado: Grado
        docente: Docente
        estado: Estado
        fecha_inicio: Inicio
        fecha_fin: Fin
        calculo_definitiva: Forma de calculo
        referente_curricular: Referente curricular
        total_actividades: Actividades
        total_objetivos: Objetivos
        total_contenidos: Contenidos

    # -----------------------------------------------------------------
    # Auditoria / Registro de actividad (V405). Los tres viven en OTRA
    # instancia de query-service -- de ahi el `base-url` propio: el
    # catalogo de auditoria corre contra ClickHouse y no comparte backend
    # con los reportes academicos.
    #
    # Ninguno expone el JSON crudo de la fila auditada (entityFieldsRaw):
    # un archivo exportado circula fuera del sistema, y ese volcado trae
    # la fila entera, datos personales incluidos.
    # -----------------------------------------------------------------

    # "Sesiones de auditoria" (pestana Por sesion). filters = los mismos
    # de la pantalla; FILTERS.IDS (CSV de family_id) exporta solo las
    # sesiones con casilla marcada.
    auditoria-sesiones:
      path: /audits/export-all
      base-url: ${REPORTING_AUDIT_CVAL_URL:http://query-service-audit-clickhouse-cval:8084}
      title: Sesiones de auditoria
      file-name: auditoria-sesiones
      columns:
        authorName: Autor
        ip: IP
        startedAt: Inicio
        endedAt: Fin
        status: Estado
        operationsCount: Operaciones

    # Detalle de UNA tabla: todos los cambios detectados sobre ella.
    # FILTERS.SLUG es obligatorio (sin el no salen filas) y va en el
    # cuerpo, no en la ruta.
    auditoria-tabla-operaciones:
      path: /audit-tables/operations/export-all
      base-url: ${REPORTING_AUDIT_CVAL_URL:http://query-service-audit-clickhouse-cval:8084}
      title: Operaciones por tabla
      file-name: auditoria-tabla
      columns:
        occurredAt: Fecha
        operation: Operacion
        authorName: Autor
        ip: IP
        entityName: Detalle
        entityId: Identificador

    # Detalle de UNA sesion de usuario: que cambio esa persona en ella.
    # FILTERS.SESSIONID es obligatorio, tambien por cuerpo.
    auditoria-sesion-operaciones:
      path: /audits/sessions/operations/export-all
      base-url: ${REPORTING_AUDIT_CVAL_URL:http://query-service-audit-clickhouse-cval:8084}
      title: Cambios de la sesion
      file-name: auditoria-sesion
      columns:
        occurredAt: Fecha
        tableSlug: Tabla
        operation: Operacion
        entityName: Detalle
        entityId: Identificador

    # -----------------------------------------------------------------
    # Asistencia > Seguimiento (V228). path = fila
    # 'eval-col-asistencias-seguimiento-export-all-001':
    # fn_asistencia_listar_seguimiento SIN paginar, con los mismos
    # filtros y el mismo gate que POST /asistencias/query.
    #
    # NO confundir con la clave `asistencia` de mas arriba: esa es el
    # "Reporte de asistencia por grupo" (E03HU57, V290), que exige grupo
    # y rango de fechas. Esta es el boton de descarga de la pantalla de
    # Seguimiento y exporta lo que el usuario tenga filtrado, sin
    # ningun filtro obligatorio.
    #
    # `columns` son las de la tabla de la pantalla. grado viene del
    # LEFT JOIN a v_asistencia_detalle que hace la fila V228 (la funcion
    # devuelve `grupo`, no `grado`). asignatura y actividad van como dos
    # columnas separadas y nunca estan llenas a la vez
    # (CK_TASISTENCIA_CONTEXTO): en preescolar/formativo la fila trae
    # actividad y la asignatura vacia. soporte_nombre es el nombre del
    # adjunto de la columna SOPORTE: en PDF/Excel no se puede pintar el
    # enlace de descarga, asi que se exporta el nombre del archivo.
    # -----------------------------------------------------------------
    asistencias:
      path: /asistencias/export-all
      title: Seguimiento de asistencia
      file-name: asistencias-seguimiento
      columns:
        estudiante: Estudiante
        tipo_asistencia: Tipo de asistencia
        asignatura: Asignatura
        actividad: Actividad
        grado: Grado
        grupo: Grupo
        fecha: Fecha
        soporte_nombre: Soporte

    # -----------------------------------------------------------------
    # Informes y consolidacion (V420). path = fila
    # 'eval-col-informes-reporte-001': fn_informe_grupo_reporte, que NO
    # consulta nada por su cuenta -- llama a la misma
    # fn_informe_grupo_listar de la pantalla, con los mismos filtros
    # (FK_TGRUPO, PERIODOS, SEARCH) y el mismo gate, y solo aplana su
    # columna JSONB de asignaturas.
    #
    # El reporte va en formato LARGO: una fila por (estudiante, periodo,
    # asignatura). La grilla de la pantalla tiene una columna por
    # asignatura, pero las asignaturas cambian por grado y estas columnas
    # son fijas, asi que no hay forma de mapearlas una a una.
    #
    # Exporta SOLO lo consolidado, y por eso no hay columna que diga si lo
    # es: la pantalla pinta con la misma forma de numero la nota guardada
    # (negro), la proyectada (gris) y -- cuando el periodo no tiene ninguna
    # calificacion -- lo que al estudiante le falta para ganar. Un boletin
    # solo puede decir la primera; impresas, las otras dos se leen como
    # calificaciones reales. La funcion las deja fuera.
    #
    # NO lleva columna `estado`, y la funcion SI la devuelve: se deja fuera
    # a proposito. Despues del filtro casi todas las filas dicen "Guardada"
    # -- es lo unico que el boletin imprime --, asi que era una columna que
    # ocupaba ancho para repetir lo mismo. Se pierde el matiz de la nota
    # guardada CON un cambio propuesto pendiente; el numero impreso es el
    # mismo igual, y quien necesite ese detalle lo tiene en la pantalla y en
    # el descargar (informes-tabla). Si alguien la repone "por simetria" con
    # ese otro reporte, esta es la razon de que no este.
    #
    # asignatura y observacion no estan llenas a la vez: en preescolar la
    # fila no tiene asignaturas y lo que vale es la observacion.
    # -----------------------------------------------------------------
    informes:
      path: /informes/reporte
      title: Informe por periodo
      file-name: informe-periodo
      columns:
        estudiante: Estudiante
        documento: Documento
        periodo: Periodo
        asignatura: Asignatura
        area: Area
        nota: Nota
        desempeno: Desempeno
        aprobada: Aprobada
        promedio: Promedio del periodo
        puesto: Puesto
        observacion: Observacion
        evidencias: Evidencias

    # -----------------------------------------------------------------
    # informes-tabla: EL DESCARGAR, que no es el boletin.
    #
    # 'eval-col-informes-tabla-001': fn_informe_grupo_tabla, que llama a
    # la misma fn_informe_grupo_listar de la pantalla y NO filtra nada.
    #
    # La diferencia con 'informes' es toda la gracia y es deliberada. El
    # boletin imprime solo lo consolidado, porque una proyeccion o una
    # nota requerida, fuera del sistema, se leen como calificaciones
    # reales. Esto otro es "bajame lo que estoy viendo": salen tambien la
    # proyectada, la requerida y la que no tiene nota, y cada una viene
    # dicha con todas las letras en la columna estado, mas una columna
    # consolidado que dice si ese periodo ya se congelo. Un volcado que
    # esconde la mitad de la tabla no sirve para revisar; uno que no
    # distingue una nota guardada de una proyeccion es peor todavia.
    #
    # evidencias trae la CUENTA de imagenes de la fila, no las imagenes:
    # este servicio arma una tabla de texto desde este mismo mapa.
    # -----------------------------------------------------------------
    informes-tabla:
      path: /informes/tabla
      title: Informe por periodo (tabla completa)
      file-name: informe-tabla
      columns:
        estudiante: Estudiante
        documento: Documento
        periodo: Periodo
        consolidado: Consolidado
        asignatura: Asignatura
        area: Area
        nota: Nota
        desempeno: Desempeno
        estado: Estado
        aprobada: Aprobada
        promedio: Promedio del periodo
        puesto: Puesto
        observacion: Observacion
        evidencias: Evidencias

    # -----------------------------------------------------------------
    # Boletin de preescolar (V466). path = fila
    # 'eval-col-informes-boletin-preescolar-001':
    # fn_informe_boletin_preescolar, que delega gate y alcance en la
    # misma fn_informe_grupo_listar de la pantalla.
    #
    # ES EL PRIMER REPORTE CON PLANTILLA PROPIA. A diferencia de los
    # demas, el diseño NO lo arma PdfRenderer a partir de `columns`:
    # lo define reportes/boletin-preescolar.jrxml, que se toma por
    # convencion de nombre (la clave). Aqui `columns` no describe una
    # grilla -- describe QUE CAMPOS LLEGAN a la plantilla, porque el
    # render recorta la fila a las columnas declaradas y lo que no este
    # en esta lista no existe para el .jrxml. Las etiquetas quedan sin
    # uso, pero se escriben igual: son la unica documentacion de que
    # significa cada campo.
    #
    # `formats: [pdf]` porque un boletin no es una grilla: en Excel
    # seria una fila ilegible por estudiante. Pedirlo asi da 400.
    #
    # `image-fields` son las columnas cuyo valor es un PK_TARCHIVO y que
    # la plantilla pinta como imagen. Sin declararlas llegarian como el
    # texto del numero y los huecos saldrian vacios.
    # -----------------------------------------------------------------
    boletin-preescolar:
      path: /informes/boletin-preescolar
      title: Boletin de preescolar
      file-name: boletin-preescolar
      formats:
        - pdf
      image-fields:
        - fondo_archivo
        - foto_archivo
        - evidencia1_archivo
        - evidencia2_archivo
        - evidencia3_archivo
        - evidencia4_archivo
        - evidencia5_archivo
        - evidencia6_archivo
      columns:
        ee_nombre: Establecimiento
        ee_dane: Dane
        ee_nit: Nit
        ciudad: Ciudad
        sede_nombre: Sede
        nivel_ensenanza: Nivel
        grado_nombre: Grado
        grupo_etiqueta: Grupo
        periodo_nombre: Periodo
        anio: Año
        fondo_archivo: Fondo
        estudiante: Estudiante
        documento: Documento
        foto_archivo: Foto
        asignatura_nombre: Asignatura o dimension
        area_nombre: Area
        observacion: Seguimiento y valoracion
        observacion_estado: Estado de la observacion
        evidencia1_titulo: Evidencia 1
        evidencia1_fecha: Fecha evidencia 1
        evidencia1_archivo: Foto evidencia 1
        evidencia2_titulo: Evidencia 2
        evidencia2_fecha: Fecha evidencia 2
        evidencia2_archivo: Foto evidencia 2
        evidencia3_titulo: Evidencia 3
        evidencia3_fecha: Fecha evidencia 3
        evidencia3_archivo: Foto evidencia 3
        evidencia4_titulo: Evidencia 4
        evidencia4_fecha: Fecha evidencia 4
        evidencia4_archivo: Foto evidencia 4
        evidencia5_titulo: Evidencia 5
        evidencia5_fecha: Fecha evidencia 5
        evidencia5_archivo: Foto evidencia 5
        evidencia6_titulo: Evidencia 6
        evidencia6_fecha: Fecha evidencia 6
        evidencia6_archivo: Foto evidencia 6
        rector_nombre: Rector

sso:
  jwt:
    # Solo la publica: este servicio verifica firmas, no emite tokens.
    # Tiene que ser la pareja de la JWT_PRIVATE_KEY de auth-center.
    public-key: ${JWT_PUBLIC_KEY}
    issuer: sso-postgres
    header-name: Authorization
    token-prefix: "Bearer "

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # Mismo bloque de telemetria que el resto de servicios Spring del
  # stack (auth-center, sso-admin, ...). Antes no existia: metricas
  # salian por el default de Boot (localhost:4318, Connection refused
  # en bucle si nadie pasaba MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED),
  # y trazas/logs no tenian endpoint, asi que con la telemetria
  # ENCENDIDA tampoco llegaban a Alloy. Los tres exporters caen a
  # false sin la env var: docker-compose.yml los deriva de
  # SSO_TELEMETRY_ENABLED.
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
    resource-attributes:
      service.namespace: sso
      deployment.environment: ${DEPLOY_ENV:dev}
  logging:
    export:
      otlp:
        enabled: ${MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED:false}
  tracing:
    enabled: ${MANAGEMENT_TRACING_EXPORT_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACING_SAMPLE_RATE:1.0}

logging:
  level:
    com.co.eurekatic.reporting: ${REPORTING_LOG_LEVEL:INFO}
    # Jasper habla mucho al compilar una plantilla; en INFO tapa el log
    # util del propio servicio.
    net.sf.jasperreports: WARN
