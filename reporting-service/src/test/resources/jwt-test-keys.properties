# Par de claves RSA SOLO PARA TESTS. No firma nada real.
#
# Vive en un fichero aparte, y no en el array `properties` de cada
# @SpringBootTest, porque un PEM son ~30 lineas de base64 y siete
# tests repitiendolas es garantia de que se desincronicen. Los tests
# lo enganchan con @TestPropertySource(locations=...).
#
# Los tests que solo verifican tokens tambien cargan la privada: la
# necesitan para FABRICAR el token que van a verificar.
#
# ---------------------------------------------------------------------------
# EL PEM VA EN UNA SOLA LINEA, con los saltos escapados como \n.
#
# java.util.Properties termina el valor en el primer salto de linea real, asi
# que un PEM pegado en varias lineas deja el valor en "-----BEGIN PUBLIC
# KEY-----" y las lineas de base64 se leen como claves sueltas sin valor. El
# sintoma no apunta al fichero: JwtTokenService recibe la armadura sin cuerpo,
# la limpia hasta dejar la cadena vacia, y falla al construir el bean con
# "no es una clave publica RSA en formato X.509/SPKI", tumbando TODOS los
# tests de integracion del modulo. Si hay que regenerar este fichero, plegar
# el PEM a una sola linea (scripts/gen-jwt-keys.sh --env ya lo emite asi).
# ---------------------------------------------------------------------------
sso.jwt.private-key=-----BEGIN PRIVATE KEY-----\\n-----END PRIVATE KEY-----\n
sso.jwt.public-key=-----BEGIN PUBLIC KEY-----\\n-----END PUBLIC KEY-----\n
