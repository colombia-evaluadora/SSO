server:
  port: 8080
  shutdown: graceful

# V30 — config for the CatalogRoutesRefresher that polls
# sso-admin's /internal/gateway/routes. The shared secret
# gates the /internal/** surface on sso-admin (see
# sso-admin's InternalTokenFilter); a missing/wrong token
# causes sso-admin to 401 the poller, which keeps the
# previous (empty) routes active (graceful degradation
# but a real outage of dynamic routing). The token MUST
# match sso-admin's `sso.internal.token` — they read the
# same env var in the standard compose layout. Top-level
# (NOT under spring:) because the names are consumed via
# @Value (gateway.catalog-url) — not part of Spring Cloud
# Gateway's schema.
gateway:
  # sso-admin's container port is 8083 (EXPOSE 8083 in its
  # Dockerfile; the host-side binding is parameterized via
  # SSO_ADMIN_PORT in docker-compose). The default here
  # is 8083 (the in-network port), not 8080 — the
  # 8080 default in older revisions was a typo from when
  # the gateway was itself the public ingress; with the
  # current compose the gateway listens on 8080 and
  # sso-admin on 8083, so the poller would always see
  # "Connection refused" if it pointed at 8080.
  catalog-url: ${GATEWAY_CATALOG_URL:http://sso-admin:8083}
  catalog-refresh-ms: ${GATEWAY_CATALOG_REFRESH_MS:30000}
  # X-Internal-Token sent on every poll. Leave blank to
  # keep the legacy behavior (no header → sso-admin 401s →
  # poller logs WARN at every tick). Empty default for
  # back-compat with deployments that don't need dynamic
  # routing (e.g. dev setups that only hit the static
  # /api/qs/** path).
  internal-token: ${GATEWAY_INTERNAL_TOKEN:}

spring:
  application:
    name: api-gateway
  main:
    banner-mode: off
    web-application-type: reactive
  cloud:
    gateway:
      # Spring Cloud Gateway 5.0.x (Spring Cloud 2025.1.2 / Oakwood)
      # moved every config knob from `spring.cloud.gateway.*` down
      # one level to `spring.cloud.gateway.server.webflux.*`. The
      # `server` node is the multi-protocol router (webflux vs
      # mvc), and `webflux` is the reactive variant — this app picks
      # the webflux branch via the new starter
      # (`spring-cloud-starter-gateway-server-webflux`).
      server:
        webflux:
          # SCG's SimpleUrlHandlerMappingGlobalCorsAutoConfiguration binds
          # `spring.cloud.gateway.server.webflux.globalcors` onto the
          # reactive router's URL handler mapping. With no globalcors
          # config, that binding is an empty map, and the router's CORS
          # processor then rejects every Origin-bearing request with
          # 403 "Invalid CORS request" BEFORE our CorsWebFilter (from the
          # CorsConfigurationSource bean) can approve it. We own CORS via
          # that bean, so turn the SCG-side handler off explicitly. (The
          # default would also be `matchIfMissing=true`, so an absent
          # property keeps the auto-config active — we have to set false
          # here.)
          globalcors:
            add-to-simple-url-handler-mapping: false
          # Static routes. The dynamic discovery locator (see
          # DynamicRouteSupportConfig) auto-creates a route per service
          # registered with Eureka, lowercased service id as the path.
          # Static routes take precedence when ids collide.
          routes:
            # Bare root "/" → 302 redirect to the admin SPA. Without
            # this, hitting http://localhost:8080/ falls through to
            # deny-by-default and returns a raw 401 error page. The SPA
            # is served at /admin/** (AdminUiGlobalFilter); once it
            # loads, RequireAuth client-side-redirects to the login
            # form. The `uri` is a required placeholder — RedirectTo
            # short-circuits the exchange before any forwarding.
            - id: root-redirect
              uri: "no://op"
              predicates:
                - Path=/
              filters:
                - RedirectTo=302, /admin/
            - id: auth-center
              uri: lb://auth-center
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
                - AddResponseHeader=X-Source, api-gateway
            - id: auth-center-info
              uri: lb://auth-center
              predicates:
                # /getUsersSSO discloses usernames + emails + full names
                # of every active user. Auth gating lives at the
                # WebFlux SecurityConfig layer (commits 11 + 12):
                # `.pathMatchers("/getUsersSSO").hasAuthority("ADMIN")`
                # rejects anonymous callers BEFORE route forwarding
                # happens. The route entry stays so ADMIN callers can
                # actually reach auth-center; the security check is
                # upstream of the route forwarder. Removing the entry
                # here would 404 legitimate ADMIN traffic, so this
                # route is auth-gated, NOT route-removed.
                #
                # /getToken was removed from this predicate in this
                # branch (commits 17-19): the controller method is
                # gone, the SecurityConfig permit-all entries on
                # both layers are gone. An anonymous /getToken
                # request hits anyExchange().authenticated() at the
                # gateway and gets 401 before any forwarding; an
                # authenticated /getToken has no controller left
                # and would have been a 404 anyway, so there is
                # nothing to forward.
                #
                # /myApps (added for the post-login app launcher) is
                # NOT in any permitAll list at either security layer —
                # it falls through to anyExchange().authenticated(),
                # same as /api/sso-admin/**. The route entry here only
                # enables forwarding; it doesn't loosen the gate.
                - Path=/login,/getApiToken,/getInfoUser,/getUsersSSO,/googleLogin,/myApps
              filters:
                - AddResponseHeader=X-Source, api-gateway
            # /api/** surface for the admin-ui SPA (VITE_API_BASE=/api).
            # The SPA talks to /api/auth/** (login/logout/refresh) and
            # /api/sso-admin/** (User/Role/Group/Microservice/Endpoint/Route
            # CRUD). We strip only the /api prefix here; auth-center's own
            # /auth/* prefix is preserved so RefreshController
            # (@RequestMapping("/auth") + @PostMapping("/refresh") etc.)
            # matches. The login endpoint is the one exception: it lives
            # directly at /login (not /auth/login) because JsonLoginFilter
            # is wired to a PathPatternRequestMatcher for "/login", so its
            # route strips one extra segment.
            - id: api-auth-login
              uri: lb://auth-center
              predicates:
                - Path=/api/auth/login
                - Method=POST
              filters:
                - StripPrefix=2
                - AddResponseHeader=X-Source, api-gateway
            # SPA-facing mirror of the bare /myApps above — same
            # StripPrefix=2 shape as api-auth-login, since
            # AuthController's method lives at the bare path, not
            # under /auth/*.
            - id: api-auth-myapps
              uri: lb://auth-center
              predicates:
                - Path=/api/auth/myApps
                - Method=GET
              filters:
                - StripPrefix=2
                - AddResponseHeader=X-Source, api-gateway
            - id: api-auth-cookie
              uri: lb://auth-center
              predicates:
                - Path=/api/auth/refresh,/api/auth/logout
              filters:
                - StripPrefix=1
                - AddResponseHeader=X-Source, api-gateway
            - id: api-sso-admin
              uri: lb://sso-admin
              predicates:
                - Path=/api/sso-admin/**
              filters:
                # StripPrefix=2 strips both /api AND /sso-admin because
                # sso-admin's controllers live at /role, /microservice,
                # /endpoint, /group, /route (no /sso-admin prefix), and
                # UserController has no prefix at all (/getUsers,
                # /createAccount, etc.). See the existing /sso-admin/**
                # route below for the legacy /sso-admin surface.
                - StripPrefix=2
                - AddResponseHeader=X-Source, api-gateway
            # sso-admin preserves the legacy `sso-service` URL surface
            # so existing clients (and the SPA) don't have to change.
            #
            # sso-admin's controllers are mounted under different
            # prefixes (`@RequestMapping("/role")`, `/microservice`,
            # `/endpoint`, `/group`, `/route`) and one with NO prefix
            # (UserController, with `/getUsers`, `/activateAccount`,
            # `/forgotPassword`, ...). We mirror that here:
            #
            #   /sso-admin/role/**         -> sso-admin/role/**
            #   /sso-admin/microservice/** -> sso-admin/microservice/**
            #   /sso-admin/endpoint/**     -> sso-admin/endpoint/**
            #   /sso-admin/group/**        -> sso-admin/group/**
            #   /sso-admin/route/**        -> sso-admin/route/**
            #   /sso-admin/**              -> sso-admin/{rest}        (StripPrefix=1, catches UserController)
            - id: sso-admin-role
              uri: lb://sso-admin
              predicates:
                - Path=/sso-admin/role/**
              filters:
                - AddResponseHeader=X-Source, api-gateway
            - id: sso-admin-microservice
              uri: lb://sso-admin
              predicates:
                - Path=/sso-admin/microservice/**
              filters:
                - AddResponseHeader=X-Source, api-gateway
            - id: sso-admin-endpoint
              uri: lb://sso-admin
              predicates:
                - Path=/sso-admin/endpoint/**
              filters:
                - AddResponseHeader=X-Source, api-gateway
            - id: sso-admin-group
              uri: lb://sso-admin
              predicates:
                - Path=/sso-admin/group/**
              filters:
                - AddResponseHeader=X-Source, api-gateway
            - id: sso-admin-route
              uri: lb://sso-admin
              predicates:
                - Path=/sso-admin/route/**
              filters:
                - AddResponseHeader=X-Source, api-gateway
            - id: sso-admin
              uri: lb://sso-admin
              predicates:
                - Path=/sso-admin/**
              filters:
                - StripPrefix=1
                - AddResponseHeader=X-Source, api-gateway
            # query-service is dynamic: each backing
            # datasource has its own container registered
            # with Eureka under query-service-<dialect> or
            # query-service-<custom-instance-name>. The
            # auto-discovery locator (see discovery.locator
            # below) auto-creates a route per service-id,
            # lowercased. So:
            #
            #   /query-service-postgres/**          ->
            #       query-service-postgres/{path}
            #   /query-service-oracle/**            ->
            #       query-service-oracle/{path}
            #   /query-service-postgres-analytics/** ->
            #       query-service-postgres-analytics/{path}
            #
            # We add a static legacy alias so existing
            # callers (which hit /qs/** in the legacy
            # sso-service URL surface) keep working — it
            # forwards to the canonical postgres instance.
            # StripPrefix=1 removes /qs before forwarding.
            - id: query-service-legacy-alias
              uri: lb://query-service-postgres
              predicates:
                - Path=/qs/**
              filters:
                - StripPrefix=1
                - AddResponseHeader=X-Source, api-gateway
            - id: api-query-service
              uri: lb://query-service-postgres
              predicates:
                - Path=/api/qs/**
              filters:
                - StripPrefix=2
                - AddResponseHeader=X-Source, api-gateway
            # ─── OpenAPI / Swagger UI: deliberately NO routes ───
            # There used to be five `forward:` routes here
            # (openapi-ui-self, openapi-spec-self,
            # openapi-webjars-self, swagger-ui-default,
            # swagger-ui-assets). They caused an infinite
            # recursion that killed the gateway with a
            # StackOverflowError on every GET /api/docs.
            #
            # Why: in Spring Cloud Gateway, `forward:` does NOT
            # rewrite the request path. ForwardRoutingFilter just
            # re-dispatches the SAME exchange into the local
            # DispatcherHandler, path untouched. The dispatcher
            # runs its handler mappings, RoutePredicateHandlerMapping
            # is one of them, it matches the very same route again
            # → forward → dispatch → match → ... until the stack
            # blows. The blown reactor stack also wedges the Netty
            # event loop, so unrelated endpoints start hanging too.
            #
            # No route is needed in the first place. The handler
            # mappings that serve the docs both outrank
            # RoutePredicateHandlerMapping (order 1):
            #   - RequestMappingHandlerMapping (order 0) serves the
            #     aggregated spec from OpenApiAggregatorController
            #     (/api/docs/v3/api-docs and /swagger-config). This
            #     is why the spec kept working while the UI hung.
            #   - springdoc's Swagger UI welcome controller (also
            #     order 0) serves /api/docs, and its webjars
            #     resource handler serves /api/docs/webjars/**.
            #     Those beans only exist when springdoc autoconfig
            #     is ON — see the `springdoc:` block below, which
            #     previously disabled it wholesale and left nothing
            #     behind the forward routes to dispatch to.
            #
            # Adding a route for a locally-served path here will
            # reintroduce the recursion. Don't.
          # 404 for unmatched paths (deny-by-default). The reactive
          # filter will translate this to a 401 for paths that need auth.
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
              include-expression: "serviceId != 'api-gateway'"
  
eureka:
    client:
      service-url:
        defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
      # healthcheck.enabled MUST be false here too: otherwise the
      # gateway itself can transiently flip to DOWN during its own
      # warm-up window, and clients (the SPA, scripts) get confusing
      # gateway-down errors. Lease/heartbeat alone is the source of
      # truth for "is this instance alive".
      healthcheck:
        enabled: false
      # The default 30s is too slow to recover from a restart. After
      # a service (e.g. auth-center) comes back UP we want the
      # gateway's ribbon cache to refresh fast so /login doesn't 503
      # for a full minute. 5s is plenty for local dev and acceptable
      # in prod (the registry delta payload is tiny).
      registry-fetch-interval-seconds: 5
    instance:
      prefer-ip-address: true
      lease-renewal-interval-in-seconds: 10
      lease-expiration-duration-in-seconds: 30
  
sso:
  jwt:
    # Sólo la pública: el gateway verifica firmas, no las emite.
    # Debe ser la pareja de la JWT_PRIVATE_KEY de auth-center.
    public-key: ${JWT_PUBLIC_KEY}
    issuer: sso-postgres
    access-token-ttl-seconds: 3600
    api-token-ttl-seconds: 86400
    header-name: Authorization
    token-prefix: "Bearer "
  cors:
    allowed-origins: ${SSO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI — the gateway aggregates each downstream service's
# /v3/api-docs into one doc served at /api/docs/v3/api-docs and renders
# the Swagger UI bundle at /api/docs/swagger-ui.html. The aggregated doc
# blends two sources (see OpenApiAggregatorService):
#   - source=springdoc — fetch the service's own /v3/api-docs via Eureka
#   - source=catalog   — query sso-admin's /internal/openapi/catalog
#                        (reuses the endpoint table admin-ui already manages)
# Adding a new internal service = drop a dep on springdoc-openapi and add
# one entry to springdoc.aggregator.services below. Adding a partner/external
# service = create the row in sso-admin (no code change here).
# ---------------------------------------------------------------------------
springdoc:
  api-docs:
    # MUST stay true. `springdoc.api-docs.enabled=false` is the
    # master switch for springdoc's ENTIRE autoconfiguration —
    # not just the /v3/api-docs endpoint. With it false, the
    # Swagger UI welcome controller and the webjars resource
    # handler are never registered, so /api/docs and
    # /api/docs/webjars/** have no local handler at all. That
    # is what left the `forward:` routes (now removed, see the
    # routes block above) dispatching into a dead end and
    # recursing until StackOverflowError.
    #
    # We still don't want springdoc's own single-app doc served
    # at /api/docs/v3/api-docs — that path belongs to
    # OpenApiAggregatorController's merged doc. So instead of
    # disabling springdoc, we park its doc on a side path. It
    # describes only the gateway itself (which has no business
    # controllers), so it's near-empty and harmless; it just has
    # to exist somewhere that doesn't collide with the
    # aggregator's mappings, or Spring fails at startup with an
    # ambiguous-mapping error.
    #
    # Side effect worth knowing: springdoc also derives its own
    # swagger-config path from this one, so it lands at
    # /api/docs/springdoc/v3/api-docs/swagger-config and leaves
    # the aggregator's /api/docs/v3/api-docs/swagger-config
    # alone. Both are under /api/docs/** which
    # GatewaySecurityConfig already permitAlls.
    enabled: true
    path: /api/docs/springdoc/v3/api-docs
  swagger-ui:
    enabled: true
    path: /api/docs             # /api/docs → redirect to the bundled UI
    url: /api/docs/v3/api-docs
    config-url: /api/docs/v3/api-docs/swagger-config
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  webjars:
    prefix: /api/docs/webjars
  cache:
    ttl: 60s
  aggregator:
    catalog-url: http://sso-admin:8083/internal/openapi/catalog
    catalog-internal-token: ${SSO_INTERNAL_TOKEN:dev-internal-token}
    services:
      - service-id: auth-center
        source: springdoc
        gateway-paths: ["/auth/**", "/api/auth/**", "/login", "/getApiToken",
                        "/getInfoUser", "/getUsersSSO", "/googleLogin", "/myApps",
                        "/internal/cache/**"]
        tag-prefix: "auth-center"
        description: "Authentication issuer — login, token issuance, user lookup"
      - service-id: sso-admin
        source: springdoc
        gateway-paths: ["/sso-admin/**", "/api/sso-admin/**",
                        "/sso-admin/role/**", "/sso-admin/microservice/**",
                        "/sso-admin/endpoint/**", "/sso-admin/group/**",
                        "/sso-admin/route/**"]
        tag-prefix: "sso-admin"
        description: "Catalog CRUD (User/Role/Group/Microservice/Endpoint/Route) and email-link flows"
      - service-id: query-service-postgres
        source: springdoc
        gateway-paths: ["/qs/**", "/api/qs/**", "/query-service-postgres/**"]
        tag-prefix: "query-service"
        description: "Query + write gateway — resolves catalog uuids to SQL and runs them"
      - service-id: hello-service
        source: springdoc
        gateway-paths: ["/hello-service/**", "/api/hello/**"]
        tag-prefix: "hello-service"
        description: "Reference reactive downstream (X-Authenticated-* header echo)"
      - service-id: provisioner
        source: springdoc
        gateway-paths: ["/provisioner/**"]
        tag-prefix: "provisioner"
        description: "Container lifecycle sidecar (Docker Engine API)"
      - service-id: notification-service
        source: springdoc
        gateway-paths: ["/actuator/providers/**", "/notification-service/actuator/providers/**"]
        tag-prefix: "notifications"
        description: "Notification provider roster (actuator)"
      - service-id: billing-service-external
        source: catalog
        gateway-paths: ["/billing/**"]
        tag-prefix: "external:billing"
        description: "Servicio externo de facturación (gestionado por partner)"
      - service-id: erp-service-external
        source: catalog
        gateway-paths: ["/erp/**"]
        tag-prefix: "external:erp"
        description: "Servicio externo ERP"

management:
    endpoints:
      web:
        exposure:
          include: health,info,gateway,prometheus
    endpoint:
      health:
        probes:
          enabled: true
        show-details: never
  
    # ---------------------------------------------------------------------------
    # Observability — pure OTLP. Metrics, traces and logs are all pushed
    # to the Grafana Alloy collector. Alloy fans out to Mimir / Tempo / Loki.
    #
    # The endpoint defaults to the OTEL_EXPORTER_OTLP_ENDPOINT env var
    # (set to http://alloy:4318 in docker-compose), falling back to
    # localhost:4318 for a developer running Alloy on the host.
    #
    # Spring Boot 4 naming (per the official 2025-11-18 Spring blog):
    #   metrics  -> management.otlp.metrics.export.url
    #   tracing  -> management.opentelemetry.tracing.export.otlp.endpoint
    #   logs     -> management.opentelemetry.logging.export.otlp.endpoint
    # The old `management.otlp.tracing.endpoint` /
    # `management.otlp.logs.export.endpoint` namespaces are silently
    # ignored in Boot 4 — the app would boot, but no traces or logs
    # would ever reach Alloy and Tempo/Loki would stay empty.
    # ---------------------------------------------------------------------------
    otlp:
      metrics:
        export:
          url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
          step: 10s
    opentelemetry:
      tracing:
        export:
          otlp:
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
      logging:
        export:
          otlp:
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
      # Resource attributes attached to every metric/trace/log so Grafana
      # can group by service. service.name comes from spring.application.name.
      resource-attributes:
        service.namespace: sso
        deployment.environment: ${DEPLOY_ENV:dev}
    tracing:
      enabled: true
      sampling:
        # 100% in dev so every request shows a trace. Lower to e.g. 0.1
        # in production to cap trace volume.
        probability: ${OTEL_TRACING_SAMPLE_RATE:1.0}
  
logging:
    level:
      root: INFO
      com.co.eurekatic: INFO
      org.springframework.cloud.gateway: INFO
      reactor.netty: INFO